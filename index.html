                transition:all 0.15s;box-shadow:0 2px 8px ${p.ac}44;"></div>`).join('');

        let colorCard = card('🎨', 'لون التطبيق', 'App Color', `
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                ${colorSwatches}
            </div>
            <div style="margin-top:12px;font-size:0.75rem;color:var(--tx3);">${L === 'ar' ? 'اختر اللون الأساسي للتطبيق' : 'Choose the primary app accent color'}</div>
        `);

        // ── Reset Button ──
        let resetCard = `
            <div style="display:flex;justify-content:center;margin-top:4px;">
                <button onclick="window.spResetAppearance()" style="
                    padding:11px 28px;border-radius:10px;border:1.5px solid var(--bd);
                    background:var(--bg);color:var(--tx3);font-weight:600;cursor:pointer;
                    font-family:inherit;font-size:0.9rem;transition:all 0.2s;
                " onmouseover="this.style.borderColor='var(--rd)';this.style.color='var(--rd)';"
                   onmouseout="this.style.borderColor='var(--bd)';this.style.color='var(--tx3)';">
                    🔄 ${L === 'ar' ? 'إعادة تعيين الافتراضي' : 'Reset to Defaults'}
                </button>
            </div>`;

        return `
        <div id="sp-appearance-panel" style="margin-top:20px;">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
                <span style="font-size:1.8rem;">🎨</span>
                <div>
                    <h2 style="margin:0;font-size:1.2rem;">${L === 'ar' ? 'ضبط المظهر والعرض' : 'Appearance Settings'}</h2>
                    <p style="margin:4px 0 0;font-size:0.8rem;color:var(--tx3);">${L === 'ar' ? 'تحكم في حجم الواجهة والخطوط والألوان' : 'Control UI scale, fonts, and colors'}</p>
                </div>
            </div>
            ${scaleCard}
            ${fontSizeCard}
            ${fontFamilyCard}
            ${colorCard}
            ${resetCard}
        </div>`;
    }

    // ─── Reset appearance to defaults ─────────────────────────────────────────
    window.spResetAppearance = function () {
        localStorage.removeItem('sp_ui_scale');
        localStorage.removeItem('sp_font_size');
        localStorage.removeItem('sp_font_family');
        localStorage.removeItem('sp_color_preset');

        window.applyUIScale(100);
        if (typeof window.setAppFontSize === 'function') window.setAppFontSize(1);
        if (typeof window.setAppFontFamily === 'function') window.setAppFontFamily('Tajawal');

        // Reset CSS variables
        let root = document.documentElement;
        root.style.removeProperty('--ac');
        root.style.removeProperty('--ac2');
        root.style.removeProperty('--acl');
        root.style.removeProperty('--btn-g');

        let L = localStorage.getItem('sp_lang') || 'ar';
        if (typeof toast === 'function') toast(L === 'ar' ? '✅ تم إعادة تعيين المظهر' : '✅ Appearance reset to defaults', 'success');
        setTimeout(() => {
            if (typeof window.injectAppearancePanel === 'function') window.injectAppearancePanel();
        }, 200);
    };

    // ─── Add Appearance Tab button to Settings ─────────────────────────────────
    function addAppearanceTab() {
        let existing = document.getElementById('sp-appearance-tab-btn');
        if (existing) return;

        let L = localStorage.getItem('sp_lang') || 'ar';

        // Find settings tabs row
        let M = document.getElementById('M');
        if (!M) return;

        // Add tab buttons row if settings is active
        let settingsContent = M.querySelector('.ph');
        if (!settingsContent) return;

        // Check if we're on settings page
        if (typeof P !== 'undefined' && P !== 'settings') return;

        // Insert tab switcher
        let tabRow = document.getElementById('sp-settings-tabs');
        if (!tabRow) {
            tabRow = document.createElement('div');
            tabRow.id = 'sp-settings-tabs';
            tabRow.style.cssText = `
                display:flex;gap:8px;margin-bottom:16px;
                background:var(--bg2);border:1px solid var(--bd);
                border-radius:12px;padding:6px;
            `;
            tabRow.innerHTML = `
                <button id="sp-tab-general" onclick="spSwitchSettingsTab('general')" style="
                    flex:1;padding:9px 12px;border-radius:8px;border:none;cursor:pointer;
                    font-family:inherit;font-size:0.85rem;font-weight:700;transition:all 0.2s;
                    background:var(--ac);color:#fff;
                ">⚙️ ${L === 'ar' ? 'عام' : 'General'}</button>
                <button id="sp-tab-appearance" onclick="spSwitchSettingsTab('appearance')" style="
                    flex:1;padding:9px 12px;border-radius:8px;border:none;cursor:pointer;
                    font-family:inherit;font-size:0.85rem;font-weight:700;transition:all 0.2s;
                    background:transparent;color:var(--tx3);
                ">🎨 ${L === 'ar' ? 'المظهر' : 'Appearance'}</button>
            `;

            // Insert before first content
            let firstEl = M.children[0];
            if (firstEl) M.insertBefore(tabRow, firstEl.nextSibling);
        }
    }

    window.spSwitchSettingsTab = function (tab) {
        let L = localStorage.getItem('sp_lang') || 'ar';
        let generalBtn = document.getElementById('sp-tab-general');
        let appearBtn = document.getElementById('sp-tab-appearance');
        let appearPanel = document.getElementById('sp-appearance-panel');

        // Style the tab buttons
        let activeStyle = 'background:var(--ac);color:#fff;';
        let inactiveStyle = 'background:transparent;color:var(--tx3);';

        if (tab === 'general') {
            if (generalBtn) generalBtn.style.cssText += ';' + activeStyle;
            if (appearBtn) appearBtn.style.cssText += ';' + inactiveStyle;
            if (appearPanel) appearPanel.style.display = 'none';

            // Show all the original settings content
            let M = document.getElementById('M');
            if (M) {
                Array.from(M.children).forEach(c => {
                    if (c.id !== 'sp-settings-tabs' && c.id !== 'sp-appearance-panel') {
                        c.style.display = '';
                    }
                });
            }
        } else if (tab === 'appearance') {
            if (generalBtn) generalBtn.setAttribute('style', generalBtn.getAttribute('style').replace('background:var(--ac);color:#fff', inactiveStyle));
            if (appearBtn) appearBtn.setAttribute('style', appearBtn.getAttribute('style').replace('background:transparent;color:var(--tx3)', activeStyle));

            // Hide all original settings content
            let M = document.getElementById('M');
            if (M) {
                Array.from(M.children).forEach(c => {
                    if (c.id !== 'sp-settings-tabs' && c.id !== 'sp-appearance-panel') {
                        c.style.display = 'none';
                    }
                });
            }

            // Show or create appearance panel
            if (!appearPanel) {
                window.injectAppearancePanel();
            } else {
                appearPanel.style.display = '';
            }
        }
    };

    window.injectAppearancePanel = function () {
        let M = document.getElementById('M');
        if (!M) return;
        let old = document.getElementById('sp-appearance-panel');
        if (old) old.remove();

        let panel = document.createElement('div');
        panel.innerHTML = buildAppearanceHTML();
        let child = panel.firstElementChild;
        M.appendChild(child);
    };

    // ─── Hook into render/settings ─────────────────────────────────────────────
    let origRender = window.render;
    window.render = function () {
        if (origRender) origRender();
        if (typeof P !== 'undefined' && P === 'settings') {
            setTimeout(addAppearanceTab, 400);
        }
    };

    // Also hook rSettings if it exists
    let origRSettings = window.rSettings;
    if (origRSettings) {
        window.rSettings = function () {
            origRSettings();
            setTimeout(addAppearanceTab, 400);
        };
    }

    // ─── Better button active state via CSS ───────────────────────────────────
    let css = document.createElement('style');
    css.innerHTML = `
        .sp-scale-btn.active, .sp-font-size-btn.active, .sp-font-fam-btn.active {
            background: var(--ac) !important;
            color: #fff !important;
            border-color: var(--ac) !important;
            box-shadow: 0 4px 12px var(--acl);
        }
        .sp-color-swatch:hover { transform: scale(1.1); }
        #sp-tab-general, #sp-tab-appearance { transition: all 0.2s !important; }
    `;
    document.head.appendChild(css);

    // ─── Watch for settings.js rSettings override ────────────────────────────
    // Since settings.js may define rSettings after this file loads,
    // we also patch via a MutationObserver on #M
    let mo = new MutationObserver(() => {
        if (typeof P !== 'undefined' && P === 'settings') {
            let tabs = document.getElementById('sp-settings-tabs');
            if (!tabs) setTimeout(addAppearanceTab, 300);
        }
    });
    let mEl = document.getElementById('M');
    if (mEl) mo.observe(mEl, { childList: true });

})();

</script>
<script>
// ============================================================
// premium_ux.js — Sales Pro Premium UX Enhancements
// Safe injection-only pattern. No existing code is modified.
// Features:
//   1. KPI Smart Banner (Motivational progress on Dashboard)
//   2. Month-over-Month Comparison (Analytics enhancement)
//   3. Daily Activity Feed (New page: 'today')
//   4. Focus Mode (Distraction-free presentation view)
//   5. Notification Center (Sidebar bell badge + dropdown)
//   6. Mobile Quick Actions (Bottom nav enhancements)
// ============================================================

(function () {
    'use strict';

    // ─── Helpers ───────────────────────────────────────────────────────────────
    function getLang() { return localStorage.getItem('sp_lang') || 'ar'; }
    function getSales() { try { return JSON.parse(localStorage.getItem('salesData') || '[]'); } catch(e) { return []; } }
    function getTargets() { try { return JSON.parse(localStorage.getItem('targetData') || '[]'); } catch(e) { return []; } }
    function getCollections() { try { return JSON.parse(localStorage.getItem('payData') || '[]'); } catch(e) { return []; } }
    function getVisits() { try { return JSON.parse(localStorage.getItem('sp_visits') || '[]'); } catch(e) { return []; } }
    function getTodos() { try { return JSON.parse(localStorage.getItem('sp_todos') || '[]'); } catch(e) { return []; } }

    function parseDate(v) {
        if (!v) return null;
        if (typeof v === 'number') {
            return new Date(Math.round((v - 25569) * 86400 * 1000));
        }
        let d = new Date(v);
        if (!isNaN(d.getTime())) return d;
        if (typeof v === 'string') {
            let p = v.split(/[\/\-]/);
            if (p.length === 3) {
                let y = p[2].length === 2 ? '20' + p[2] : p[2];
                return new Date(`${y}-${('0'+p[1]).slice(-2)}-${('0'+p[0]).slice(-2)}`);
            }
        }
        return null;
    }

    function fmtNum(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
        return Math.round(n).toLocaleString('en-US');
    }

    function todayStr() { return new Date().toISOString().split('T')[0]; }

    // ──────────────────────────────────────────────────────────────────────────
    // FEATURE 1: KPI Smart Banner (injected after Dashboard renders)
    // ──────────────────────────────────────────────────────────────────────────
    function injectKPIBanner() {
        if (document.getElementById('sp-kpi-banner')) return;
        let M = document.getElementById('M');
        if (!M) return;

        let L = getLang();
        let S_data = getSales();
        let T_data = getTargets();
        if (S_data.length === 0 && T_data.length === 0) return;

        // Calc totals
        let totalTarget = 0, totalAchieved = 0;
        let sMap = {};
        S_data.forEach(r => {
            let c = r.Customer || '';
            let v = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
            sMap[c] = (sMap[c] || 0) + v;
        });
        T_data.forEach(r => {
            totalTarget += Number(r.Target || 0);
            totalAchieved += sMap[r.Customer || ''] || 0;
        });

        let pct = totalTarget > 0 ? Math.min((totalAchieved / totalTarget) * 100, 100) : 0;

        // Days remaining in month
        let now = new Date();
        let lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        let daysLeft = lastDay - now.getDate();

        let mood = '', moodColor = '', emoji = '';
        if (pct >= 100) { mood = L === 'ar' ? '🎉 مبروك! الهدف تحقق بالكامل!' : '🎉 Goal Achieved!'; moodColor = '#10b981'; emoji = '🏆'; }
        else if (pct >= 80) { mood = L === 'ar' ? 'ممتاز! قريب جداً من الهدف، استمر!' : 'Excellent! Almost there!'; moodColor = '#3b82f6'; emoji = '🚀'; }
        else if (pct >= 50) { mood = L === 'ar' ? 'أداء جيد، ما زال أمامك وقت!' : 'Good progress, keep going!'; moodColor = '#f59e0b'; emoji = '💪'; }
        else { mood = L === 'ar' ? 'هيا بنا! الهدف في المتناول!' : 'Let\'s go! Target is reachable!'; moodColor = '#ef4444'; emoji = '⚡'; }

        let banner = document.createElement('div');
        banner.id = 'sp-kpi-banner';
        banner.style.cssText = `
            background: linear-gradient(135deg, var(--bg2,#1e293b) 0%, var(--bg3,#0f172a) 100%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        `;
        banner.innerHTML = `
            <div style="position:absolute;top:0;right:0;width:120px;height:120px;background:${moodColor};opacity:0.06;border-radius:50%;transform:translate(30px,-30px);"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
                <div style="flex:1;min-width:200px;">
                    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
                        <span style="font-size:1.8rem;">${emoji}</span>
                        <div>
                            <div style="font-size:0.75rem;color:var(--tx3,#64748b);text-transform:uppercase;letter-spacing:1px;font-weight:600;">${L === 'ar' ? 'نسبة إنجاز التارجت' : 'Target Achievement'}</div>
                            <div style="font-size:0.9rem;color:${moodColor};font-weight:700;">${mood}</div>
                        </div>
                    </div>
                    <div style="background:rgba(255,255,255,0.06);border-radius:50px;height:12px;overflow:hidden;position:relative;">
                        <div id="sp-kpi-fill" style="height:100%;width:0%;background:linear-gradient(90deg,${moodColor},${moodColor}aa);border-radius:50px;transition:width 1.2s cubic-bezier(.4,0,.2,1);"></div>
                    </div>
                    <div style="display:flex;justify-content:space-between;margin-top:6px;">
                        <span style="font-size:0.75rem;color:var(--tx3,#64748b);">${fmtNum(totalAchieved)} ${L === 'ar' ? 'محقق' : 'achieved'}</span>
                        <span style="font-size:0.85rem;color:${moodColor};font-weight:800;">${pct.toFixed(1)}%</span>
                        <span style="font-size:0.75rem;color:var(--tx3,#64748b);">${fmtNum(totalTarget)} ${L === 'ar' ? 'هدف' : 'target'}</span>
                    </div>
                </div>
                <div style="text-align:center;background:rgba(255,255,255,0.04);border-radius:12px;padding:14px 20px;border:1px solid rgba(255,255,255,0.06);">
                    <div style="font-size:2rem;font-weight:900;color:var(--tx1,#f1f5f9);line-height:1;">${daysLeft}</div>
                    <div style="font-size:0.7rem;color:var(--tx3,#64748b);margin-top:4px;">${L === 'ar' ? 'يوم متبقي في الشهر' : 'days left in month'}</div>
                </div>
            </div>
        `;

        let firstCard = M.querySelector('.kg, .card');
        if (firstCard) {
            M.insertBefore(banner, firstCard);
        } else {
            M.prepend(banner);
        }

        // Animate progress bar
        requestAnimationFrame(() => {
            setTimeout(() => {
                let fill = document.getElementById('sp-kpi-fill');
                if (fill) fill.style.width = pct.toFixed(1) + '%';
            }, 200);
        });
    }

    // ──────────────────────────────────────────────────────────────────────────
    // FEATURE 2: Month-over-Month Comparison in Analytics
    // ──────────────────────────────────────────────────────────────────────────
    function injectMoMComparison() {
        if (document.getElementById('sp-mom-card')) return;
        let M = document.getElementById('M');
        if (!M) return;

        let L = getLang();
        let S_data = getSales();
        if (S_data.length === 0) return;

        let now = new Date();
        let curY = now.getFullYear(), curM = now.getMonth();
        let prevY = curM === 0 ? curY - 1 : curY;
        let prevM = curM === 0 ? 11 : curM - 1;

        let curSales = 0, prevSales = 0;
        let curOrders = new Set(), prevOrders = new Set();

        S_data.forEach(r => {
            let d = parseDate(r['Invoice Date'] || r['Order Date'] || r['Date']);
            if (!d) return;
            let v = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
            if (d.getFullYear() === curY && d.getMonth() === curM) {
                curSales += v;
                if (r['Order Nbr']) curOrders.add(r['Order Nbr']);
            }
            if (d.getFullYear() === prevY && d.getMonth() === prevM) {
                prevSales += v;
                if (r['Order Nbr']) prevOrders.add(r['Order Nbr']);
            }
        });

        let salesGrowth = prevSales > 0 ? ((curSales - prevSales) / prevSales) * 100 : 0;
        let ordersGrowth = prevOrders.size > 0 ? ((curOrders.size - prevOrders.size) / prevOrders.size) * 100 : 0;

        let monthNames = {
            ar: ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],
            en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
        };

        function growthBadge(pct) {
            let color = pct >= 0 ? '#10b981' : '#ef4444';
            let arrow = pct >= 0 ? '↑' : '↓';
            return `<span style="color:${color};font-weight:700;font-size:0.85rem;">${arrow} ${Math.abs(pct).toFixed(1)}%</span>`;
        }

        let card = document.createElement('div');
        card.id = 'sp-mom-card';
        card.style.cssText = `margin: 20px 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--bd,rgba(255,255,255,0.08));`;
        card.innerHTML = `
            <div style="padding:16px 20px;background:var(--bg2,#1e293b);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd,rgba(255,255,255,0.08));">
                <h3 style="margin:0;font-size:1rem;display:flex;align-items:center;gap:8px;">
                    <span>📈</span> ${L === 'ar' ? 'مقارنة الأشهر' : 'Month Comparison'}
                </h3>
                <span style="font-size:0.75rem;color:var(--tx3,#64748b);">${monthNames[L][prevM]} vs ${monthNames[L][curM]}</span>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;background:var(--bg,#0f172a);">
                <div style="padding:20px;border-left:1px solid var(--bd,rgba(255,255,255,0.08));">
                    <div style="font-size:0.7rem;color:var(--tx3,#64748b);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">${L === 'ar' ? 'مبيعات الشهر الحالي' : 'Current Month Sales'}</div>
                    <div style="font-size:1.5rem;font-weight:800;color:var(--tx1,#f1f5f9);margin-bottom:4px;">${fmtNum(curSales)}</div>
                    <div style="font-size:0.7rem;color:var(--tx3,#64748b);">vs ${fmtNum(prevSales)} ${L === 'ar' ? 'الشهر الماضي' : 'last month'}</div>
                    <div style="margin-top:8px;">${growthBadge(salesGrowth)}</div>
                </div>
                <div style="padding:20px;">
                    <div style="font-size:0.7rem;color:var(--tx3,#64748b);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">${L === 'ar' ? 'عدد الفواتير الحالي' : 'Current Month Orders'}</div>
                    <div style="font-size:1.5rem;font-weight:800;color:var(--tx1,#f1f5f9);margin-bottom:4px;">${curOrders.size}</div>
                    <div style="font-size:0.7rem;color:var(--tx3,#64748b);">vs ${prevOrders.size} ${L === 'ar' ? 'الشهر الماضي' : 'last month'}</div>
                    <div style="margin-top:8px;">${growthBadge(ordersGrowth)}</div>
                </div>
            </div>
        `;

        M.insertBefore(card, M.firstChild);
    }

    // ──────────────────────────────────────────────────────────────────────────
    // FEATURE 3: Daily Activity Feed (new page 'today')
    // ──────────────────────────────────────────────────────────────────────────
    window.rToday = function () {
        let L = getLang();
        let today = todayStr();
        let S_data = getSales();
        let C_data = getCollections();
        let V_data = getVisits();
        let Todo_data = getTodos();

        // Today's sales
        let todaySales = S_data.filter(r => {
            let d = parseDate(r['Invoice Date'] || r['Order Date'] || r['Date']);
            return d && d.toISOString().split('T')[0] === today;
        });

        // Today's collections
        let todayCols = C_data.filter(r => {
            let d = parseDate(r['Date'] || r['date'] || r['Payment Date']);
            return d && d.toISOString().split('T')[0] === today;
        });

        // Today's visits
        let todayVisits = V_data.filter(v => v.date === today);

        // Completed todos
        let doneTodos = Todo_data.filter(t => t.done);

        let todaySalesTotal = 0;
        let todaySalesRows = '';
        todaySales.forEach(r => {
            let v = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
            todaySalesTotal += v;
            todaySalesRows += `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
                    <div>
                        <div style="font-weight:600;font-size:0.9rem;">${r.Customer || '-'}</div>
                        <div style="font-size:0.75rem;color:var(--tx3,#64748b);">${r['Item Description'] || r['Item Class Name'] || ''}</div>
                    </div>
                    <div style="font-weight:700;color:#10b981;">${fmtNum(v)}</div>
                </div>`;
        });

        let todayColsTotal = 0;
        let todayColsRows = '';
        todayCols.forEach(r => {
            let keys = Object.keys(r);
            let getV = (names) => { let k = keys.find(k => names.some(n => k.toLowerCase().replace(/\s+/g,'') === n.toLowerCase().replace(/\s+/g,''))); return k ? r[k] : 0; };
            let v = Number((getV(['Amount','Collection']) || '0').toString().replace(/,/g,'')) || 0;
            let cust = getV(['Customer Name','Customer']) || '-';
            todayColsTotal += v;
            todayColsRows += `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);">
                    <div style="font-weight:600;font-size:0.9rem;">${cust}</div>
                    <div style="font-weight:700;color:#3b82f6;">${fmtNum(v)}</div>
                </div>`;
        });

        function section(icon, titleAr, titleEn, count, total, rows, color, emptyAr, emptyEn) {
            return `
                <div style="background:var(--bg2,#1e293b);border-radius:16px;border:1px solid var(--bd,rgba(255,255,255,0.08));overflow:hidden;margin-bottom:16px;">
                    <div style="padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.05);">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <span style="font-size:1.4rem;">${icon}</span>

        function calcNotifications() {
            let notifs = [];
            let L = getLang();
            let S_data = getSales();
            let T_data = getTargets();
            let Todo_data = getTodos();

            // 1. Dormant customers (30+ days)
            let latestByCustomer = {};
            S_data.forEach(r => {
                let d = parseDate(r['Invoice Date'] || r['Order Date'] || r['Date']);
                let c = r.Customer;
                if (d && c) {
                    if (!latestByCustomer[c] || d > latestByCustomer[c]) latestByCustomer[c] = d;
                }
            });
            let dormantCount = 0;
            let today = new Date();
            Object.values(latestByCustomer).forEach(d => {
                if (Math.floor((today - d) / 86400000) >= 30) dormantCount++;
            });
            if (dormantCount > 0) {
                notifs.push({ icon: '💤', color: '#ef4444', text: L === 'ar' ? `${dormantCount} عميل خامل منذ 30+ يوم` : `${dormantCount} customers dormant 30+ days`, page: 'dormant' });
            }

            // 2. Customers near target (90%+)
            let sMap = {};
            S_data.forEach(r => { let c = r.Customer || ''; let v = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0); sMap[c] = (sMap[c] || 0) + v; });
            let nearCount = 0, overCount = 0;
            T_data.forEach(r => {
                let tg = Number(r.Target || 0);
                let ach = sMap[r.Customer || ''] || 0;
                let p = tg > 0 ? ach / tg * 100 : 0;
                if (p >= 100) overCount++;
                else if (p >= 90) nearCount++;
            });
            if (overCount > 0) notifs.push({ icon: '🏆', color: '#10b981', text: L === 'ar' ? `${overCount} عميل حقق التارجت 100%!` : `${overCount} customers hit 100% target!`, page: 'targets' });
            if (nearCount > 0) notifs.push({ icon: '🎯', color: '#3b82f6', text: L === 'ar' ? `${nearCount} عملاء قريبون من الهدف (90%+)` : `${nearCount} customers near target (90%+)`, page: 'targets' });

            // 3. Overdue todos
            let overdueTodos = Todo_data.filter(t => !t.done && t.dueDate && new Date(t.dueDate) < today);
            if (overdueTodos.length > 0) notifs.push({ icon: '📋', color: '#f59e0b', text: L === 'ar' ? `${overdueTodos.length} مهمة متأخرة` : `${overdueTodos.length} overdue tasks`, page: 'todo' });

            // 4. Today's activity summary
            let todaySales = S_data.filter(r => { let d = parseDate(r['Invoice Date'] || r['Order Date'] || r['Date']); return d && d.toISOString().split('T')[0] === todayStr(); });

            return notifs;
        }

            sbb.insertBefore(btn, sbb.firstChild);

            // Dropdown
            let dd = document.createElement('div');
            dd.id = 'sp-notif-dropdown';
            let L = getLang();
            dd.innerHTML = `
                <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;">
                    <span style="font-weight:700;font-size:0.95rem;">🔔 ${L === 'ar' ? 'الإشعارات' : 'Notifications'}</span>
                    <span style="font-size:0.75rem;color:var(--tx3,#64748b);">${notifs.length} ${L === 'ar' ? 'إشعار' : 'alerts'}</span>
                </div>

                    : notifs.map(n => `
                        <div class="sp-notif-item" onclick="if(typeof window.nav==='function') window.nav('${n.page}'); else { window.P='${n.page}'; if(typeof buildNav==='function') buildNav(); if(typeof render==='function') render(); } document.getElementById('sp-notif-dropdown').classList.remove('open');">

            }
        }
        addTodayNav();

        // Extend render to support 'today' page and inject KPI banner on dash
        let origRender = window.render;
        window.render = function () {
            if (typeof P !== 'undefined') {
                if (P === 'today') {
                    if (typeof buildNav === 'function') buildNav();
                    window.rToday();
                    return;
                }
            }
            if (origRender) origRender();
            // Inject KPI Banner after dashboard renders
            if (typeof P !== 'undefined' && P === 'dash') {
                setTimeout(injectKPIBanner, 300);
            }
            // Inject MoM on analytics
            if (typeof P !== 'undefined' && P === 'analytics') {
                setTimeout(injectMoMComparison, 300);
            }
        };

        // Extend buildNav to label 'today'
        let origBN = window.buildNav;
        window.buildNav = function () {
            if (origBN) origBN();
            setTimeout(() => {
                let L = getLang();
                let el = document.querySelector('.ni[data-p="today"] span:nth-child(2)');
                if (el) el.textContent = L === 'ar' ? 'سجل اليوم' : 'Daily Feed';
            }, 60);
        };
    })();

})();

<script>
// ============================================================
// quick_search.js — Sales Pro Global Quick Search (Ctrl+K)
// Opens a floating search modal on Ctrl+K or search button click.
// Searches across: customers, invoices, products, pages.
// Safe injection — no existing code modified.
// ============================================================

(function () {
    'use strict';

    // ─── Inject CSS ────────────────────────────────────────────────────────────
    let style = document.createElement('style');
    style.id = 'sp-qs-css';
    style.innerHTML = `
        #sp-qs-overlay {
            position: fixed; inset: 0; z-index: 99999;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            display: flex; align-items: flex-start; justify-content: center;

            max-height: 420px; overflow-y: auto;
        }
        #sp-qs-results::-webkit-scrollbar { width: 4px; }
        #sp-qs-results::-webkit-scrollbar-track { background: transparent; }
        #sp-qs-results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
        .sp-qs-section-label {
            padding: 8px 20px 4px;
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--tx3, #64748b); font-weight: 700;
        }
        .sp-qs-result {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 20px; cursor: pointer;
            transition: background 0.12s; border-radius: 8px;
            margin: 0 8px 2px;
        }
        .sp-qs-result:hover, .sp-qs-result.selected {
            background: rgba(80,70,229,0.15);
        }
        .sp-qs-result-icon {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0;
        }
        .sp-qs-result-main { flex: 1; min-width: 0; }
        .sp-qs-result-title { font-weight: 600; font-size: 0.9rem; color: var(--tx1, #f1f5f9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sp-qs-result-sub { font-size: 0.75rem; color: var(--tx3, #64748b); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sp-qs-result-badge {
            font-size: 0.7rem; font-weight: 700; padding: 3px 8px;
            border-radius: 20px; flex-shrink: 0;
        }
        .sp-qs-empty {
            text-align: center; padding: 40px 20px;
            color: var(--tx3, #64748b); font-size: 0.9rem;
        }
        #sp-qs-footer {
            padding: 10px 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; gap: 16px;
            font-size: 0.7rem; color: var(--tx3, #64748b);
        }
        .sp-qs-key {
            background: rgba(255,255,255,0.08); border-radius: 5px;
            padding: 2px 6px; font-size: 0.68rem; font-family: monospace;
            border: 1px solid rgba(255,255,255,0.12);
        }
        #sp-qs-search-btn {
            background: none; border: none; cursor: pointer;
            color: var(--tx2, #94a3b8); font-size: 1rem; padding: 4px 6px;
            border-radius: 6px; transition: all 0.2s; display: flex; align-items: center; gap: 4px;
        }
        #sp-qs-search-btn:hover { background: rgba(255,255,255,0.08); color: var(--tx1,#f1f5f9); }
    `;
    document.head.appendChild(style);

    // ─── Build search data ─────────────────────────────────────────────────────
    function buildIndex() {
        let L = localStorage.getItem('sp_lang') || 'ar';
        let S_data = [];
        let T_data = [];
        try { S_data = JSON.parse(localStorage.getItem('salesData') || '[]'); } catch(e) {}
        try { T_data = JSON.parse(localStorage.getItem('targetData') || '[]'); } catch(e) {}

        let results = [];

        // Pages
        let pages = [
            { icon: '🏠', title: L === 'ar' ? 'لوحة التحكم' : 'Dashboard', page: 'dash', color: '#5046e5' },
            { icon: '💰', title: L === 'ar' ? 'المبيعات' : 'Sales', page: 'sales', color: '#10b981' },
            { icon: '🎯', title: L === 'ar' ? 'تارجت العملاء' : 'Targets', page: 'targets', color: '#f59e0b' },
            { icon: '🏪', title: L === 'ar' ? 'العملاء' : 'Customers', page: 'customers', color: '#3b82f6' },
            { icon: '📅', title: L === 'ar' ? 'سجل اليوم' : 'Daily Feed', page: 'today', color: '#8b5cf6' },
            { icon: '📋', title: L === 'ar' ? 'المهام' : 'To-Do', page: 'todo', color: '#06b6d4' },
            { icon: '🚗', title: L === 'ar' ? 'الزيارات' : 'Visits', page: 'visits', color: '#f97316' },
            { icon: '🤝', title: L === 'ar' ? 'محتملين' : 'Leads', page: 'leads', color: '#ec4899' },
            { icon: '🧠', title: L === 'ar' ? 'التحليلات' : 'Analytics', page: 'analytics', color: '#a78bfa' },
            { icon: '💵', title: L === 'ar' ? 'هامش الربح' : 'Profit', page: 'profit', color: '#34d399' },
            { icon: '⭐', title: L === 'ar' ? 'المميزين' : 'Key Accounts', page: 'keyacc', color: '#fbbf24' },
            { icon: '💤', title: L === 'ar' ? 'الخاملين' : 'Dormant', page: 'dormant', color: '#ef4444' },
            { icon: '🔔', title: L === 'ar' ? 'التنبيهات' : 'Alerts', page: 'alerts', color: '#f59e0b' },
            { icon: '⚙️', title: L === 'ar' ? 'الإعدادات' : 'Settings', page: 'settings', color: '#64748b' },
        ];
        pages.forEach(p => results.push({ type: 'page', ...p }));

        // Customers (unique from sales + targets)
        let customers = new Set();
        S_data.forEach(r => { if (r.Customer) customers.add(r.Customer); });
        T_data.forEach(r => { if (r.Customer) customers.add(r.Customer); });
        customers.forEach(c => {
            let sTotal = 0;
            S_data.filter(r => r.Customer === c).forEach(r => {
                sTotal += typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
            });
            results.push({ type: 'customer', icon: '🏪', title: c, sub: `${L === 'ar' ? 'إجمالي المبيعات:' : 'Total Sales:'} ${sTotal >= 1000 ? (sTotal/1000).toFixed(1)+'K' : Math.round(sTotal)}`, page: 'customers', color: '#3b82f6', value: sTotal });
        });

        // Products / Items (unique)
        let items = {};
        S_data.forEach(r => {
            let name = r['Item Description'] || r['Item Class Name'];
            if (name) {
                items[name] = (items[name] || 0) + (typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0));
            }
        });
        Object.entries(items).slice(0, 200).forEach(([name, val]) => {
            results.push({ type: 'product', icon: '📦', title: name, sub: `${L === 'ar' ? 'مبيعات:' : 'Sales:'} ${val >= 1000 ? (val/1000).toFixed(1)+'K' : Math.round(val)}`, page: 'sales', color: '#10b981', value: val });
        });

        return results;
    }

    // ─── Search Logic ──────────────────────────────────────────────────────────
    let allItems = [];
    let selectedIdx = 0;

    function doSearch(q) {
        if (!q || q.trim().length === 0) return getRecent();
        let lower = q.toLowerCase();
        return allItems
            .filter(r => r.title.toLowerCase().includes(lower) || (r.sub || '').toLowerCase().includes(lower))
            .sort((a, b) => {
                let aS = a.title.toLowerCase().startsWith(lower) ? 0 : 1;
                let bS = b.title.toLowerCase().startsWith(lower) ? 0 : 1;
                return aS - bS || (b.value || 0) - (a.value || 0);
            })
            .slice(0, 20);
    }

    function getRecent() {
        let L = localStorage.getItem('sp_lang') || 'ar';
        let pages = allItems.filter(r => r.type === 'page').slice(0, 6);
        let topCustomers = allItems.filter(r => r.type === 'customer').sort((a,b) => (b.value||0)-(a.value||0)).slice(0,4);
        return [...pages, ...topCustomers];
    }

    function highlight(text, q) {
        if (!q) return text;
        let idx = text.toLowerCase().indexOf(q.toLowerCase());
        if (idx === -1) return text;
        return text.slice(0, idx) + `<mark style="background:rgba(80,70,229,0.4);color:inherit;border-radius:2px;">${text.slice(idx, idx + q.length)}</mark>` + text.slice(idx + q.length);
    }

    function renderResults(items, q) {
        let L = localStorage.getItem('sp_lang') || 'ar';
        let resultsEl = document.getElementById('sp-qs-results');
        if (!resultsEl) return;
        selectedIdx = 0;

        if (items.length === 0) {
            resultsEl.innerHTML = `<div class="sp-qs-empty">🔍 ${L === 'ar' ? 'لا توجد نتائج لـ' : 'No results for'} "${q}"</div>`;
            return;
        }

        let grouped = {};
        items.forEach(r => {
            if (!grouped[r.type]) grouped[r.type] = [];
            grouped[r.type].push(r);
        });

        let typeLabels = { page: L === 'ar' ? 'الصفحات' : 'Pages', customer: L === 'ar' ? 'العملاء' : 'Customers', product: L === 'ar' ? 'المنتجات' : 'Products' };
        let html = '';
        let itemIdx = 0;

        Object.entries(grouped).forEach(([type, group]) => {
            html += `<div class="sp-qs-section-label">${typeLabels[type] || type}</div>`;
            group.forEach(item => {
                let badge = type === 'page' ? `<span class="sp-qs-result-badge" style="background:${item.color}22;color:${item.color};">${L === 'ar' ? 'صفحة' : 'page'}</span>` :
                            type === 'customer' ? `<span class="sp-qs-result-badge" style="background:rgba(59,130,246,0.15);color:#3b82f6;">${L === 'ar' ? 'عميل' : 'customer'}</span>` :
                            `<span class="sp-qs-result-badge" style="background:rgba(16,185,129,0.15);color:#10b981;">${L === 'ar' ? 'منتج' : 'product'}</span>`;
                html += `
                    <div class="sp-qs-result${itemIdx === 0 ? ' selected' : ''}" data-idx="${itemIdx}" data-page="${item.page}" data-customer="${type === 'customer' ? item.title : ''}" onclick="spQsNavigate(this)">
                        <div class="sp-qs-result-icon" style="background:${item.color}22;">${item.icon}</div>
                        <div class="sp-qs-result-main">
                            <div class="sp-qs-result-title">${highlight(item.title, q)}</div>
                            ${item.sub ? `<div class="sp-qs-result-sub">${item.sub}</div>` : ''}
                        </div>
                        ${badge}
                    </div>`;
                itemIdx++;
            });
        });

        resultsEl.innerHTML = html;
    }

    // ─── Navigation ────────────────────────────────────────────────────────────
    window.spQsNavigate = function (el) {
        let page = el.getAttribute('data-page');
        let customer = el.getAttribute('data-customer');
        closeSearch();
        if (page) {
            if (typeof window.P !== 'undefined') window.P = page;
            if (typeof buildNav === 'function') buildNav();
            if (typeof render === 'function') render();
            // Special: if it's a customer search, try to open customer profile
            if (customer && typeof window.openCustomerProfile === 'function') {
                setTimeout(() => window.openCustomerProfile(customer), 300);
            }
        }
    };

    // ─── Keyboard navigation ───────────────────────────────────────────────────
    function moveSelection(dir) {
        let items = document.querySelectorAll('.sp-qs-result');
        if (!items.length) return;
        items[selectedIdx]?.classList.remove('selected');
        selectedIdx = Math.max(0, Math.min(items.length - 1, selectedIdx + dir));
        items[selectedIdx]?.classList.add('selected');
        items[selectedIdx]?.scrollIntoView({ block: 'nearest' });
    }

    // ─── Open / Close ──────────────────────────────────────────────────────────
    function openSearch() {
        allItems = buildIndex();
        let overlay = document.getElementById('sp-qs-overlay');
        if (!overlay) return;
        overlay.classList.add('open');
        setTimeout(() => {
            let inp = document.getElementById('sp-qs-input');
            if (inp) { inp.focus(); inp.value = ''; }
            renderResults(getRecent(), '');
        }, 50);
    }

    function closeSearch() {
        let overlay = document.getElementById('sp-qs-overlay');
        if (overlay) overlay.classList.remove('open');
    }

    // ─── Build DOM ─────────────────────────────────────────────────────────────
    function buildSearchUI() {
        if (document.getElementById('sp-qs-overlay')) return;
        let L = localStorage.getItem('sp_lang') || 'ar';

        let overlay = document.createElement('div');
        overlay.id = 'sp-qs-overlay';
        overlay.innerHTML = `
            <div id="sp-qs-box">
                <div id="sp-qs-input-wrap">
                    <span style="font-size:1.1rem;color:var(--tx3,#64748b);">🔍</span>
                    <input id="sp-qs-input" type="text" placeholder="${L === 'ar' ? 'ابحث عن عميل، منتج، أو صفحة...' : 'Search customers, products, pages...'}" autocomplete="off" spellcheck="false">
                    <button id="sp-qs-clear" onclick="document.getElementById('sp-qs-input').value='';document.getElementById('sp-qs-input').dispatchEvent(new Event('input'));document.getElementById('sp-qs-input').focus();">✕</button>
                </div>
                <div id="sp-qs-results"></div>
                <div id="sp-qs-footer">
                    <span><span class="sp-qs-key">↑↓</span> ${L === 'ar' ? 'تنقل' : 'navigate'}</span>
                    <span><span class="sp-qs-key">Enter</span> ${L === 'ar' ? 'فتح' : 'open'}</span>
                    <span><span class="sp-qs-key">Esc</span> ${L === 'ar' ? 'إغلاق' : 'close'}</span>
                    <span style="margin-right:auto;"><span class="sp-qs-key">Ctrl</span> + <span class="sp-qs-key">K</span></span>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);

        // Close on overlay click
        overlay.addEventListener('click', e => { if (e.target === overlay) closeSearch(); });

        // Input events
        let inp = document.getElementById('sp-qs-input');
        let debounceTimer;
        inp.addEventListener('input', e => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                let q = e.target.value.trim();
                renderResults(doSearch(q), q);
            }, 120);
        });

        inp.addEventListener('keydown', e => {
            if (e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); moveSelection(-1); }
            else if (e.key === 'Enter') {
                e.preventDefault();
                let selected = document.querySelector('.sp-qs-result.selected');
                if (selected) selected.click();
            }
            else if (e.key === 'Escape') closeSearch();
        });
    }

    // ─── Add search button to sidebar ─────────────────────────────────────────
    function addSearchBtn() {
        let sbt = document.querySelector('.sbt, .sbr');
        if (!sbt || document.getElementById('sp-qs-search-btn')) return;
        let L = localStorage.getItem('sp_lang') || 'ar';
        let btn = document.createElement('button');
        btn.id = 'sp-qs-search-btn';
        btn.title = L === 'ar' ? 'بحث سريع (Ctrl+K)' : 'Quick Search (Ctrl+K)';
        btn.innerHTML = `<span>🔍</span><span style="font-size:0.65rem;opacity:0.6;">Ctrl+K</span>`;
        btn.onclick = openSearch;

        // Insert into sidebar top area
        let sbTitleEl = document.querySelector('.sbt');
        if (sbTitleEl) sbTitleEl.appendChild(btn);
    }

    // ─── Keyboard shortcut ─────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            let overlay = document.getElementById('sp-qs-overlay');
            if (overlay && overlay.classList.contains('open')) {
                closeSearch();
            } else {
                openSearch();
            }
        }
        if (e.key === 'Escape') {
            let overlay = document.getElementById('sp-qs-overlay');
            if (overlay && overlay.classList.contains('open')) closeSearch();
        }
    });

    // ─── Initialize ────────────────────────────────────────────────────────────
    function init() {
        buildSearchUI();
        addSearchBtn();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(init, 1000));
    } else {
        setTimeout(init, 1000);
    }

    // Re-add search button on nav rebuild
    let _origBNQS = window.buildNav;
    window.buildNav = function () {
        if (_origBNQS) _origBNQS();
        setTimeout(addSearchBtn, 200);
    };

    window.spOpenSearch = openSearch;
    window.spCloseSearch = closeSearch;

})();

</script>
<script>
// ============================================================
// customer_reports.js — Sales Pro Professional Customer PDF Reports
// Adds "Print Report" button to Targets & Customers pages.
// Uses pdfmake (already loaded in index.html).
// Safe injection — no existing code modified.
// ============================================================

(function () {
    'use strict';

    // ─── Helpers ───────────────────────────────────────────────────────────────
    function getLang() { return localStorage.getItem('sp_lang') || 'ar'; }

    function getSalesData() {
        try { return JSON.parse(localStorage.getItem('salesData') || '[]'); } catch(e) { return []; }
    }

    function getTargetData() {
        try { return JSON.parse(localStorage.getItem('targetData') || '[]'); } catch(e) { return []; }
    }

    function getCollectionsData() {
        try { return JSON.parse(localStorage.getItem('payData') || '[]'); } catch(e) { return []; }
    }

    function getVisitsData() {
        try { return JSON.parse(localStorage.getItem('sp_visits') || '[]'); } catch(e) { return []; }
    }

    function parseDate(v) {
        if (!v) return null;
        if (typeof v === 'number') return new Date(Math.round((v - 25569) * 86400 * 1000));
        let d = new Date(v);
        if (!isNaN(d.getTime())) return d;
        if (typeof v === 'string') {
            let p = v.split(/[\/\-]/);
            if (p.length === 3) {
                let y = p[2].length === 2 ? '20' + p[2] : p[2];
                return new Date(`${y}-${('0'+p[1]).slice(-2)}-${('0'+p[0]).slice(-2)}`);
            }
        }
        return null;
    }

    function fmtN(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 }); }

    function fmtDate(d) {
        if (!d) return '-';
        let dt = parseDate(d);
        if (!dt) return String(d);
        return dt.toLocaleDateString('en-GB');
    }

    // ─── Core Report Generator ─────────────────────────────────────────────────
    window.generateCustomerReport = function (customerName) {
        if (typeof pdfMake === 'undefined') {
            alert('PDF library not loaded. Please refresh the page.');
            return;
        }

        let L = getLang();
        let S_data = getSalesData();
        let T_data = getTargetData();
        let C_data = getCollectionsData();
        let V_data = getVisitsData();

        // Filter data for this customer
        let custSales = S_data.filter(r => r.Customer === customerName);
        let custTarget = T_data.find(r => r.Customer === customerName) || {};
        let custVisits = V_data.filter(v => v.customer === customerName);

        // Calculate collections
        let custColTotal = 0;
        C_data.forEach(r => {
            let keys = Object.keys(r);
            let getV = (names) => { let k = keys.find(k => names.some(n => k.toLowerCase().replace(/\s+/g,'') === n.toLowerCase().replace(/\s+/g,''))); return k ? r[k] : null; };
            let cName = getV(['Customer Name','Customer']) || '';
            if (cName === customerName) {
                let rawVal = getV(['Amount','Collection']) || 0;
                custColTotal += Number(rawVal.toString().replace(/,/g,'')) || 0;
            }
        });

        // Totals
        let totalSales = 0, totalProfit = 0;
        custSales.forEach(r => {
            totalSales += typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
            totalProfit += typeof getProfitVal === 'function' ? getProfitVal(r) : Number(r['Profit'] || 0);
        });

        let target = Number(custTarget.Target || 0);
        let pctTarget = target > 0 ? Math.min((totalSales / target) * 100, 100) : 0;
        let due = Math.max(0, totalSales - custColTotal);
        let margin = totalSales > 0 ? (totalProfit / totalSales) * 100 : 0;
        let reportDate = new Date().toLocaleDateString(L === 'ar' ? 'ar-EG' : 'en-GB', { year: 'numeric', month: 'long', day: 'numeric' });

        // Last 10 invoices
        let recentSales = [...custSales]
            .sort((a, b) => {
                let da = parseDate(a['Invoice Date'] || a['Order Date'] || a['Date']);
                let db = parseDate(b['Invoice Date'] || b['Order Date'] || b['Date']);
                return (db || 0) - (da || 0);
            })
            .slice(0, 10);

        // Category breakdown
        let catMap = {};
        custSales.forEach(r => {
            let cat = r['Item Class Name'] || (L === 'ar' ? 'أخرى' : 'Other');
            let v = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
            catMap[cat] = (catMap[cat] || 0) + v;
        });

    // ─── AGING DEBT RADAR & CREDIT GUARD ─────────────────────────────────────────
    window.rAgingDebt = function() {
        let L = getLang();
        let S_data = getSalesData();
        let C_data = getCollectionsData();
        let now = new Date();

        // Calculate debts per customer
        let custDebts = {};
        S_data.forEach(r => {
            let c = r.Customer || r['Customer Name'];
            if(!c) return;
            if(!custDebts[c]) custDebts[c] = { name: c, sales: 0, coll: 0, invoices: [] };
            let val = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
            let d = parseDate(r['Invoice Date'] || r['Order Date'] || r['Date']) || now;
            custDebts[c].sales += val;
            custDebts[c].invoices.push({ amount: val, date: d });
        });

        C_data.forEach(r => {
            let keys = Object.keys(r);
            let getV = (names) => { let k = keys.find(k => names.some(n => k.toLowerCase().replace(/\s+/g,'') === n.toLowerCase().replace(/\s+/g,''))); return k ? r[k] : null; };
            let c = getV(['Customer Name','Customer']) || '';
            if (c && custDebts[c]) {
                let rawVal = getV(['Amount','Collection']) || 0;
                custDebts[c].coll += Number(rawVal.toString().replace(/,/g,'')) || 0;
            }
        });

        let cat30 = 0, cat60 = 0, cat90 = 0, catCrit = 0, totalDue = 0;
        let debtList = [];

        Object.values(custDebts).forEach(item => {
            let due = Math.max(0, item.sales - item.coll);
            if (due <= 0) return;
            totalDue += due;

            // Find oldest unpaid estimate
            let lastInv = item.invoices.sort((a,b) => b.date - a.date)[0];
            let days = lastInv ? Math.floor((now - lastInv.date) / (1000 * 60 * 60 * 24)) : 10;
            
            if (days <= 30) cat30 += due;
            else if (days <= 60) cat60 += due;
            else if (days <= 90) cat90 += due;
            else catCrit += due;

            debtList.push({ name: item.name, due: due, days: days, sales: item.sales, coll: item.coll });
        });

        debtList.sort((a,b) => b.due - a.due);

        let html = `
            <div class="ph" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;">
                <h1 style="display:flex;align-items:center;gap:12px;margin:0;"><span style="width:36px;height:36px;display:flex;">🛡️</span> ${L==='ar'?'رادار أعمار الديون والحد الائتماني':'Aging Debt Radar & Credit Guard'}</h1>
                <button class="btn btn-wa" onclick="sendBulkPaymentReminders()" style="padding:10px 16px;">💬 ${L==='ar'?'إرسال تذكيرات بالواتساب':'Send WhatsApp Reminders'}</button>
            </div>

            <!-- Aging Summary Grid -->
            <div class="aging-grid">
                <div class="aging-card aging-card-30">
                    <div style="font-size:0.8rem;color:var(--tx3);">${L==='ar'?'🟢 جارية (أقل من 30 يوم)':'🟢 Current (< 30 Days)'}</div>
                    <div style="font-size:1.4rem;font-weight:800;color:#10b981;margin-top:4px;">${cat30.toLocaleString()} <small style="font-size:0.75rem;">${L==='ar'?'ج.م':'EGP'}</small></div>
                </div>
                <div class="aging-card aging-card-60">
                    <div style="font-size:0.8rem;color:var(--tx3);">${L==='ar'?'🟡 تستحق قريباً (31-60 يوم)':'🟡 Due Soon (31-60 Days)'}</div>
                    <div style="font-size:1.4rem;font-weight:800;color:#f59e0b;margin-top:4px;">${cat60.toLocaleString()} <small style="font-size:0.75rem;">${L==='ar'?'ج.م':'EGP'}</small></div>
                </div>
                <div class="aging-card aging-card-90">
                    <div style="font-size:0.8rem;color:var(--tx3);">${L==='ar'?'🟠 متأخرة (61-90 يوم)':'🟠 Overdue (61-90 Days)'}</div>
                    <div style="font-size:1.4rem;font-weight:800;color:#f97316;margin-top:4px;">${cat90.toLocaleString()} <small style="font-size:0.75rem;">${L==='ar'?'ج.م':'EGP'}</small></div>
                </div>
                <div class="aging-card aging-card-crit">
                    <div style="font-size:0.8rem;color:var(--tx3);">${L==='ar'?'🔴 حرجة (+90 يوم)':'🔴 Critical (+90 Days)'}</div>
                    <div style="font-size:1.4rem;font-weight:800;color:#ef4444;margin-top:4px;">${catCrit.toLocaleString()} <small style="font-size:0.75rem;">${L==='ar'?'ج.م':'EGP'}</small></div>
                </div>
            </div>

            <!-- Detailed Aging Table -->
            <div class="card">
                <div style="overflow-x:auto;">
                    <table style="width:100%;border-collapse:collapse;white-space:nowrap;">
                        <thead>
                            <tr style="background:var(--bg3);border-bottom:2px solid var(--bd);">
                                <th style="padding:14px 12px;color:var(--tx2);text-align:right;">${L==='ar'?'العميل':'Customer'}</th>
                                <th style="padding:14px 12px;color:var(--tx2);text-align:center;">${L==='ar'?'إجمالي المديونية':'Total Due'}</th>
                                <th style="padding:14px 12px;color:var(--tx2);text-align:center;">${L==='ar'?'فترة التأخير':'Aging Bucket'}</th>
                                <th style="padding:14px 12px;color:var(--tx2);text-align:center;">${L==='ar'?'حالة الائتمان':'Credit Status'}</th>
                                <th style="padding:14px 12px;color:var(--tx2);text-align:center;">${L==='ar'?'إجراءات':'Actions'}</th>
                            </tr>
                        </thead>
                        <tbody>
        `;

        debtList.forEach(item => {
            let bucketColor = item.days <= 30 ? '#10b981' : (item.days <= 60 ? '#f59e0b' : (item.days <= 90 ? '#f97316' : '#ef4444'));

function getFilteredStock() {
    let d = [...stockData];

    }
    switch (stockSort) {
        case 'import':      d.sort((a, b) => (a.importOrder ?? 9999) - (b.importOrder ?? 9999)); break;
        case 'price_asc':   d.sort((a, b) => (a.price||0) - (b.price||0)); break;

        case 'qty_asc':     d.sort((a, b) => (a.qty ?? 9999) - (b.qty ?? 9999)); break;

        }
    }
    return d;
}

function getStats() {
    const total    = stockData.length;

    const brands   = new Set(stockData.map(p => p.brand || p.category).filter(Boolean)).size;
    return { total, totalVal, outStock, lowStock, unset, brands };
}

function renderProducts(items) {

    return currentView === 'grid' ? renderGrid(items) : renderList(items);
}

function renderList(items) {
    const groups = {}; const groupOrder = [];
    items.forEach(p => {
        const k = p.brand || p.category || t('أخرى','Other');
        if (!groups[k]) { groups[k] = []; groupOrder.push(k); }
        groups[k].push(p);
    });
    let html = '<div class="stk-list">';
    groupOrder.forEach(brand => {
        const prods = groups[brand];
        html += `<div class="stk-sec-lbl"><span>🏷️ ${brand}</span><span class="stk-sec-cnt">${fmtNum(prods.length)} ${t('منتج','Items')}</span></div>`;
        prods.forEach(p => {
            const qs  = qtyState(p.qty);
            const rc  = qs==='out'?'row-out':qs==='low'?'row-low':'';
            const qv  = (p.qty===null||p.qty===undefined) ? '' : p.qty;
            html += `
<div class="stk-row ${selectedIds.has(p.id)?'selected':''} ${rc}" data-id="${p.id}">
  <div class="stk-ck" data-select="${p.id}">✓</div>
  ${p.image?`<img class="stk-ri" src="${p.image}" alt="" loading="lazy">`:`<div class="stk-riph">📦</div>`}
  <div class="stk-inf">
    <div class="stk-icode">${p.code||'—'} ${p.itemClass?`<span style="color:var(--tx3);">· ${p.itemClass}</span>`:''}</div>
    <div class="stk-iname">${p.name}</div>
    <div class="stk-ibrand">${p.brand||''}</div>
  </div>
  <div class="stk-prices-box">
    <div class="sp-tier sp-tu"><span class="sp-tier-l">${t('يوزر','User')}</span><span class="sp-tier-v">${fmtPrice(p.price)}</span></div>
    <div class="sp-tier sp-td"><span class="sp-tier-l">${t('ديلر','Dealer')}</span><span class="sp-tier-v">${fmtPrice(p.cost)}</span></div>
    <div class="sp-tier sp-tb"><span class="sp-tier-l">Best</span><span class="sp-tier-v">${fmtPrice(p.bestPrice)}</span></div>
  </div>
  <div>${qtyBadge(p.qty, p.qtyOnHand)}</div>
  <div class="qty-editor" title="${t('تعديل المتاح','Edit Available')}">
    <button class="qbtn" data-qminus="${p.id}">−</button>
    <input class="qinp" type="number" value="${qv}" min="0" placeholder="—" data-qinput="${p.id}">
    <button class="qbtn" data-qplus="${p.id}">+</button>
  </div>
  <div class="stk-acts">
    <button class="abt" data-edit="${p.id}" title="${t('تعديل','Edit')}">✏️</button>
    <button class="abt abt-del" data-del="${p.id}" title="${t('حذف','Delete')}">🗑️</button>
  </div>
</div>`;
        });
    });
    return html + '</div>';
}

/* ══════════════════════════════════════════════════════════
   RE-RENDER & EVENTS
══════════════════════════════════════════════════════════ */
function reRender() {
    const c = document.getElementById('stkProducts');
    if (c) c.innerHTML = renderProducts(getFilteredStock());
    const ce = document.querySelector('.stk-cnt');
    if (ce) ce.textContent = fmtNum(getFilteredStock().length) + ' ' + t('منتج','Items');
    updateBulk();
}
function updateBulk() {
    const b = document.getElementById('stkBulk');
    const e = document.getElementById('stkBulkCnt');
    if (!b) return;
    if (selectedIds.size > 0) { b.classList.add('on'); if(e) e.textContent = selectedIds.size + ' ' + t('محدد','Selected'); }
    else b.classList.remove('on');
}

function setQty(id, val) {
    const i = stockData.findIndex(p => p.id === id); if(i===-1) return;
    stockData[i].qty = val; stockData[i].updatedAt = new Date().toISOString();
    saveStock(stockData); reRender();
}
function adjQty(id, d) {
    const i = stockData.findIndex(p => p.id === id); if(i===-1) return;
    const cur = stockData[i].qty ?? 0;
    setQty(id, Math.max(0, cur + d));
}

function fileToB64(f) { return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(f);}); }
async function resizeB64(b64,mw=600,mh=600,q=.82){return new Promise(res=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>mw||h>mh){const r=Math.min(mw/w,mh/h);w=Math.round(w*r);h=Math.round(h*r);}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',q));};img.src=b64;});}

function attachEvents() {
    // Toolbar search & filters
    document.getElementById('stkSearch')?.addEventListener('input', e => { stockFilter=e.target.value; reRender(); });
    document.getElementById('stkCatSel')?.addEventListener('change', e => { stockCatFilter=e.target.value; reRender(); });
    document.getElementById('stkSortSel')?.addEventListener('change', e => { stockSort=e.target.value; settings.lastSort=stockSort; saveSettings(settings); reRender(); });
    document.getElementById('vList')?.addEventListener('click', () => { currentView='list'; settings.lastView='list'; saveSettings(settings); document.getElementById('vList').classList.add('on'); document.getElementById('vGrid').classList.remove('on'); reRender(); });
    document.getElementById('vGrid')?.addEventListener('click', () => { currentView='grid'; settings.lastView='grid'; saveSettings(settings); document.getElementById('vGrid').classList.add('on'); document.getElementById('vList').classList.remove('on'); reRender(); });

    // Threshold adjust
    document.getElementById('stkThrMinus')?.addEventListener('click', (e) => {
        e.stopPropagation();
        lowThreshold = Math.max(1, lowThreshold - 1);
        settings.lowThreshold = lowThreshold; saveSettings(settings);
        window.rStock();
    });
    document.getElementById('stkThrPlus')?.addEventListener('click', (e) => {
        e.stopPropagation();

function setupExcelImport() {
    let parsedRows = [];
    const inp   = document.getElementById('xlFileInp');
    const drop  = document.getElementById('xlDrop');
    const btnOK = document.getElementById('xlMOK');

    if (inp) inp.addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
    if (drop) {
        drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
        drop.addEventListener('dragleave', () => drop.classList.remove('over'));
        drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
    }

    document.querySelectorAll('#xlMR, #xlMM').forEach(l => {
        l.addEventListener('click', () => {
            document.querySelectorAll('.xl-mc').forEach(x => x.classList.remove('on'));
            l.classList.add('on');
        });
    });

    function handleFile(file) {
        if (typeof XLSX === 'undefined') { showToast(t('❌ مكتبة Excel غير محملة','❌ Excel library not loaded'),'error'); return; }
        const r = new FileReader();
        r.onload = e => {
            try {
                const wb = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
                if (raw.length < 2) { showToast(t('❌ الملف فارغ','❌ File is empty'),'error'); return; }

                let startRow = 1;
                const r0 = raw[0].map(c => String(c).toLowerCase().trim());
                if (!r0.some(c => c.includes('code') || c.includes('item') || c.includes('description') || c.includes('price') || c.includes('كود') || c.includes('صنف'))) {
                    startRow = 0;
                }

                parsedRows = [];
                for (let i = startRow; i < raw.length; i++) {
                    const row = raw[i];
                    if (!row || !row.some(c => c !== '')) continue;

                    const code        = String(row[0] || '').trim();
                    const name        = String(row[1] || '').trim() || code;
                    const qtyOnHand   = (row[2] !== '' && !isNaN(Number(row[2]))) ? Number(row[2]) : null;
                    const qtyAvail    = (row[3] !== '' && !isNaN(Number(row[3]))) ? Number(row[3]) : null;
                    const priceUser   = (row[4] !== '' && !isNaN(Number(row[4]))) ? Number(row[4]) : 0;
                    const priceDealer = (row[5] !== '' && !isNaN(Number(row[5]))) ? Number(row[5]) : 0;
                    const priceBest   = (row[6] !== '' && !isNaN(Number(row[6]))) ? Number(row[6]) : 0;
                    const brand       = String(row[7] || '').trim() || t('عام','General');
                    const itemClass   = String(row[8] || '').trim();

                    if (code || name) {
                        parsedRows.push({
                            id: uid(), code, name,
                            qtyOnHand, qty: qtyAvail,
                            price: priceUser, cost: priceDealer, bestPrice: priceBest,
                            brand, category: itemClass || brand, itemClass,
                            importOrder: i,
                            updatedAt: new Date().toISOString()
                        });
                    }
                }

                if (!parsedRows.length) { showToast(t('❌ لم يتم العثور على بيانات صالحة','❌ No valid data found'),'error'); return; }

                document.getElementById('xlDC').style.display = 'none';
                document.getElementById('xlCC').style.display = 'block';
                document.getElementById('xlFN').textContent = '📄 ' + file.name;
                document.getElementById('xlRC').textContent = fmtNum(parsedRows.length) + ' ' + t('منتج جاهز للاستيراد','items ready');

                const tb = document.getElementById('xlPB');
                tb.innerHTML = parsedRows.slice(0, 5).map(p => `
                    <tr>
                        <td><b>${p.code || '—'}</b></td>
                        <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.name}</td>
                        <td><span style="color:#10b981;font-weight:800;">${p.qty!=null?fmtNum(p.qty):'—'}</span></td>
                        <td>${fmtPrice(p.price)}</td>
                        <td>${fmtPrice(p.cost)}</td>
                        <td>${fmtPrice(p.bestPrice)}</td>
                    </tr>
                `).join('');
                document.getElementById('xlPS').style.display = 'block';

                btnOK.disabled = false;
                btnOK.style.opacity = '1';
                showToast(t('✅ تم قراءة ','✅ Parsed ')+fmtNum(parsedRows.length)+t(' منتج',' items'),'success');
            } catch (err) {
                showToast(t('❌ خطأ في قراءة الملف: ','❌ File error: ')+err.message,'error');
            }
        };
        r.readAsBinaryString(file);
    }

    btnOK?.addEventListener('click', async () => {
        if (!parsedRows.length) return;
        const mode = document.querySelector('input[name="xlMode"]:checked')?.value || 'replace';
        const pw = document.getElementById('xlPW'); const pf = document.getElementById('xlPF');
        pw.style.display = 'block'; pf.style.width = '70%';

        if (mode === 'replace') {
            stockData = parsedRows;
        } else {
            const map = new Map(stockData.map(p => [(p.code||p.name).toLowerCase(), p]));
            parsedRows.forEach(p => {
                const k = (p.code||p.name).toLowerCase();
                if (map.has(k)) {
                    const ex = map.get(k);
                    Object.assign(ex, p, { id: ex.id, image: ex.image || p.image });
                } else {
                    stockData.push(p);
                }
            });
        }

        const newCats = [...new Set(stockData.map(p => p.category || p.itemClass).filter(Boolean))];
        if (newCats.length) { stockCats = [...new Set([...stockCats, ...newCats])]; saveCats(stockCats); }

        saveStock(stockData);
        pf.style.width = '100%';
        await new Promise(r => setTimeout(r, 200));

        document.getElementById('xlModal')?.classList.remove('on');
        pw.style.display = 'none'; pf.style.width = '0%';
        window.rStock();
        showToast(t('✅ تم استيراد ','✅ Imported ')+fmtNum(parsedRows.length)+t(' منتج بنجاح!',' items successfully!'),'success');
    });
}

function setupModalEvents() {
    let curImg = null;
    const imgInp  = document.getElementById('stkImgFile');
    const imgArea = document.getElementById('stkImgArea');
    const imgPrev = document.getElementById('stkImgPrev');
    const imgPh   = document.getElementById('stkImgPh');
    const imgRm   = document.getElementById('stkImgRm');

    if (imgArea) imgArea.onclick = () => imgInp?.click();
    if (imgInp) imgInp.onchange = async e => {
        const f = e.target.files[0]; if(!f) return;
        if(f.size > 5*1024*1024) { showToast(t('❌ حجم الصورة أكبر من 5MB','❌ Image > 5MB'),'error'); return; }
        try {
            const b64 = await fileToB64(f);
            curImg = await resizeB64(b64, 500, 500, 0.85);
            imgPrev.src = curImg; imgPrev.style.display = 'block'; imgPh.style.display = 'none'; imgRm.style.display = 'block';
            imgArea.classList.add('has-img');
        } catch { showToast(t('❌ خطأ في معالجة الصورة','❌ Image Error'),'error'); }
    };
    if (imgRm) imgRm.onclick = e => {
        e.stopPropagation(); curImg = null; imgInp.value = '';
        imgPrev.style.display = 'none'; imgPh.style.display = 'block'; imgRm.style.display = 'none';
        imgArea.classList.remove('has-img');
    };

    document.getElementById('stkMSave')?.addEventListener('click', () => {
        const name = document.getElementById('mfName')?.value.trim();
        if (!name) { showToast(t('❌ يرجى كتابة اسم المنتج','❌ Enter item name'),'error'); return; }

        const product = {
            id: editingId || uid(),
            name,
            code:        document.getElementById('mfCode')?.value.trim() || '',
            brand:       document.getElementById('mfBrand')?.value.trim() || '',
            category:    document.getElementById('mfCat')?.value || '',
            price:       parseFloat(document.getElementById('mfPrice')?.value) || 0,
            cost:        parseFloat(document.getElementById('mfCost')?.value) || 0,
            bestPrice:   parseFloat(document.getElementById('mfBest')?.value) || 0,
            qtyOnHand:   document.getElementById('mfQtyOnHand')?.value !== '' ? parseInt(document.getElementById('mfQtyOnHand')?.value) : null,
            qty:         document.getElementById('mfQty')?.value !== '' ? parseInt(document.getElementById('mfQty')?.value) : null,
            desc:        document.getElementById('mfDesc')?.value.trim() || '',
            image:       curImg,
            updatedAt:   new Date().toISOString()
        };

        if (editingId) {
            const i = stockData.findIndex(p => p.id === editingId);
            if (i !== -1) stockData[i] = { ...stockData[i], ...product, image: curImg ?? stockData[i].image };
            showToast(t('✅ تم تعديل المنتج','✅ Item Updated'),'success');
        } else {
            product.createdAt = product.updatedAt;
            stockData.unshift(product);
            showToast(t('✅ تمت إضافة المنتج','✅ Item Added'),'success');
        }

        saveStock(stockData);
        closeModal();
        window.rStock();
    });
}

let curImg = null;
function openModal(id = null) {
    editingId = id;
    const titleEl = document.getElementById('stkMTitle');
    if (titleEl) titleEl.textContent = id ? t('✏️ تعديل منتج','✏️ Edit Item') : t('＋ منتج جديد','＋ New Item');
    document.getElementById('stkModal')?.classList.add('on');
    curImg = null;
    const imgPrev = document.getElementById('stkImgPrev');
    const imgPh   = document.getElementById('stkImgPh');
    const imgRm   = document.getElementById('stkImgRm');
    const imgArea = document.getElementById('stkImgArea');
    if (imgPrev) imgPrev.style.display = 'none';
    if (imgPh) imgPh.style.display = 'block';
    if (imgRm) imgRm.style.display = 'none';
    if (imgArea) imgArea.classList.remove('has-img');

    if (id) {
        const p = stockData.find(x => x.id === id); if(!p) return;
        if (document.getElementById('mfName')) document.getElementById('mfName').value = p.name || '';
        if (document.getElementById('mfCode')) document.getElementById('mfCode').value = p.code || '';
        if (document.getElementById('mfBrand')) document.getElementById('mfBrand').value = p.brand || '';
        if (document.getElementById('mfCat')) document.getElementById('mfCat').value = p.category || '';
        if (document.getElementById('mfPrice')) document.getElementById('mfPrice').value = p.price || '';
        if (document.getElementById('mfCost')) document.getElementById('mfCost').value = p.cost || '';
        if (document.getElementById('mfBest')) document.getElementById('mfBest').value = p.bestPrice || '';
        if (document.getElementById('mfQtyOnHand')) document.getElementById('mfQtyOnHand').value = p.qtyOnHand != null ? p.qtyOnHand : '';
        if (document.getElementById('mfQty')) document.getElementById('mfQty').value = p.qty != null ? p.qty : '';
        if (document.getElementById('mfDesc')) document.getElementById('mfDesc').value = p.desc || '';
        if (p.image) {
            curImg = p.image;
            if (imgPrev) { imgPrev.src = p.image; imgPrev.style.display = 'block'; }
            if (imgPh) imgPh.style.display = 'none';
            if (imgRm) imgRm.style.display = 'block';
            if (imgArea) imgArea.classList.add('has-img');
        }
    } else {
        if (document.getElementById('mfName')) document.getElementById('mfName').value = '';
        if (document.getElementById('mfCode')) document.getElementById('mfCode').value = '';
        if (document.getElementById('mfBrand')) document.getElementById('mfBrand').value = '';
        if (document.getElementById('mfPrice')) document.getElementById('mfPrice').value = '';
        if (document.getElementById('mfCost')) document.getElementById('mfCost').value = '';
        if (document.getElementById('mfBest')) document.getElementById('mfBest').value = '';
        if (document.getElementById('mfQtyOnHand')) document.getElementById('mfQtyOnHand').value = '';
        if (document.getElementById('mfQty')) document.getElementById('mfQty').value = '';
        if (document.getElementById('mfDesc')) document.getElementById('mfDesc').value = '';
    }
}

function closeModal() {
    document.getElementById('stkModal')?.classList.remove('on');
    editingId = null;
}

window.openModal = openModal;
window.closeModal = closeModal;

function toggleSel(id) {
    if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
    updateBulk(); reRender();
}
function confDel(id) {
    const p = stockData.find(x => x.id === id); if(!p) return;
    if (confirm(t('حذف "','Delete "')+p.name+t('"؟','"?'))) {
        stockData = stockData.filter(x => x.id !== id);
        saveStock(stockData);
        selectedIds.delete(id);
        window.rStock();
        showToast(t('✅ تم الحذف','✅ Deleted'),'success');
    }
}

function showToast(msg, type) {
    if (typeof window.toast === 'function') { window.toast(msg, type); return; }
    const t = document.getElementById('TT'); if(!t) return;
    t.textContent = msg; t.className = 'toast show';
    setTimeout(() => t.className = 'toast', 3000);
}

</div>`;

    if (typeof html2pdf !== 'undefined') {
        const div = document.createElement('div');
        div.innerHTML = html;
        div.style.cssText = `position:fixed;top:-9999px;left:-9999px;width:1060px;direction:${t('rtl','ltr')};`;
        document.body.appendChild(div);
        try {
            await html2pdf().set({
                margin: [0,0,0,0],
                filename: company.replace(/\s+/g,'_') + '-Catalog-' + Date.now() + '.pdf',
                image: { type:'jpeg', quality: 0.95 },
                html2canvas: { scale: 2, useCORS: true, allowTaint: true, logging: false },
                jsPDF: { unit:'mm', format:'a4', orientation:'portrait' },
                pagebreak: { mode:['avoid-all','css'] }
            }).from(div.firstElementChild).save();
            showToast(t('✅ تم توليد الكتالوج بنجاح!','✅ Catalog Generated!'),'success');
        } catch(e) {
            showToast(t('❌ خطأ في توليد PDF','❌ PDF Error'),'error');
            console.error(e);
        } finally {
            document.body.removeChild(div);
        }
    } else {
        const w = window.open('','_blank');
        w.document.write(`<!DOCTYPE html><html><head><title>${company} Catalog</title></head><body>${html}</body></html>`);
        w.document.close(); w.focus();
        setTimeout(() => w.print(), 1000);
        showToast(t('✅ تم فتح نافذة الطباعة','✅ Opened Print Dialog'),'success');
    }
}

})();

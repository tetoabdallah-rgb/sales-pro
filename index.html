<script>
// ============================================================
// premium_ux.js — Sales Pro Premium UX Enhancements
// Safe injection-only pattern. No existing code is modified.
// Features:

(function () {
    'use strict';

    // ─── Helpers ───────────────────────────────────────────────────────────────
    function getLang() { return localStorage.getItem('sp_lang') || 'ar'; }
    function getSales() { try { return JSON.parse(localStorage.getItem('salesData') || '[]'); } catch(e) { return []; } }
    function getTargets() { try { return JSON.parse(localStorage.getItem('targetData') || '[]'); } catch(e) { return []; } }
    function getCollections() { try { return JSON.parse(localStorage.getItem('payData') || '[]'); } catch(e) { return []; } }
    function getVisits() { try { return JSON.parse(localStorage.getItem('sp_visits') || '[]'); } catch(e) { return []; } }
    function getTodos() { try { return JSON.parse(localStorage.getItem('sp_todos') || '[]'); } catch(e) { return []; } }

    function parseDate(v) {
        if (!v) return null;
        if (typeof v === 'number') {
            return new Date(Math.round((v - 25569) * 86400 * 1000));
        }
        let d = new Date(v);
        if (!isNaN(d.getTime())) return d;
        if (typeof v === 'string') {
            let p = v.split(/[\/\-]/);
            if (p.length === 3) {
                let y = p[2].length === 2 ? '20' + p[2] : p[2];
                return new Date(`${y}-${('0'+p[1]).slice(-2)}-${('0'+p[0]).slice(-2)}`);
            }
        }
        return null;
    }

    function fmtNum(n) {
        if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
        return Math.round(n).toLocaleString('en-US');
    }

    function todayStr() { return new Date().toISOString().split('T')[0]; }

    // ──────────────────────────────────────────────────────────────────────────
    // FEATURE 1: KPI Smart Banner (injected after Dashboard renders)
    // ──────────────────────────────────────────────────────────────────────────
    function injectKPIBanner() {
        if (document.getElementById('sp-kpi-banner')) return;
        let M = document.getElementById('M');
        if (!M) return;

        let L = getLang();
        let S_data = getSales();
        let T_data = getTargets();
        if (S_data.length === 0 && T_data.length === 0) return;

        // Calc totals
        let totalTarget = 0, totalAchieved = 0;
        let sMap = {};
        S_data.forEach(r => {
            let c = r.Customer || '';
            let v = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
            sMap[c] = (sMap[c] || 0) + v;
        });
        T_data.forEach(r => {
            totalTarget += Number(r.Target || 0);
            totalAchieved += sMap[r.Customer || ''] || 0;
        });

        let pct = totalTarget > 0 ? Math.min((totalAchieved / totalTarget) * 100, 100) : 0;

        // Days remaining in month
        let now = new Date();
        let lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        let daysLeft = lastDay - now.getDate();

        let mood = '', moodColor = '', emoji = '';
        if (pct >= 100) { mood = L === 'ar' ? '🎉 مبروك! الهدف تحقق بالكامل!' : '🎉 Goal Achieved!'; moodColor = '#10b981'; emoji = '🏆'; }
        else if (pct >= 80) { mood = L === 'ar' ? 'ممتاز! قريب جداً من الهدف، استمر!' : 'Excellent! Almost there!'; moodColor = '#3b82f6'; emoji = '🚀'; }
        else if (pct >= 50) { mood = L === 'ar' ? 'أداء جيد، ما زال أمامك وقت!' : 'Good progress, keep going!'; moodColor = '#f59e0b'; emoji = '💪'; }
        else { mood = L === 'ar' ? 'هيا بنا! الهدف في المتناول!' : 'Let\'s go! Target is reachable!'; moodColor = '#ef4444'; emoji = '⚡'; }

        let banner = document.createElement('div');
        banner.id = 'sp-kpi-banner';
        banner.style.cssText = `
            background: linear-gradient(135deg, var(--bg2,#1e293b) 0%, var(--bg3,#0f172a) 100%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        `;
        banner.innerHTML = `
            <div style="position:absolute;top:0;right:0;width:120px;height:120px;background:${moodColor};opacity:0.06;border-radius:50%;transform:translate(30px,-30px);"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
                <div style="flex:1;min-width:200px;">
                    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">

    // ──────────────────────────────────────────────────────────────────────────
    // FEATURE 2: Month-over-Month Comparison in Analytics
    // ──────────────────────────────────────────────────────────────────────────
    function injectMoMComparison() {
        if (document.getElementById('sp-mom-card')) return;
        let M = document.getElementById('M');
        if (!M) return;

        let L = getLang();
        let S_data = getSales();
        if (S_data.length === 0) return;

        let now = new Date();
        let curY = now.getFullYear(), curM = now.getMonth();
        let prevY = curM === 0 ? curY - 1 : curY;
        let prevM = curM === 0 ? 11 : curM - 1;

        let curSales = 0, prevSales = 0;
        let curOrders = new Set(), prevOrders = new Set();

        S_data.forEach(r => {
            let d = parseDate(r['Invoice Date'] || r['Order Date'] || r['Date']);
            if (!d) return;
            let v = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
            if (d.getFullYear() === curY && d.getMonth() === curM) {
                curSales += v;
                if (r['Order Nbr']) curOrders.add(r['Order Nbr']);
            }
            if (d.getFullYear() === prevY && d.getMonth() === prevM) {
                prevSales += v;
                if (r['Order Nbr']) prevOrders.add(r['Order Nbr']);
            }
        });

        let salesGrowth = prevSales > 0 ? ((curSales - prevSales) / prevSales) * 100 : 0;
        let ordersGrowth = prevOrders.size > 0 ? ((curOrders.size - prevOrders.size) / prevOrders.size) * 100 : 0;

        let monthNames = {
            ar: ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],
            en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
        };

        function growthBadge(pct) {
            let color = pct >= 0 ? '#10b981' : '#ef4444';
            let arrow = pct >= 0 ? '↑' : '↓';
            return `<span style="color:${color};font-weight:700;font-size:0.85rem;">${arrow} ${Math.abs(pct).toFixed(1)}%</span>`;
        }

        let card = document.createElement('div');
        card.id = 'sp-mom-card';
        card.style.cssText = `margin: 20px 0; border-radius: 16px; overflow: hidden; border: 1px solid var(--bd,rgba(255,255,255,0.08));`;
        card.innerHTML = `
            <div style="padding:16px 20px;background:var(--bg2,#1e293b);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd,rgba(255,255,255,0.08));">
                <h3 style="margin:0;font-size:1rem;display:flex;align-items:center;gap:8px;">
                    <span>📈</span> ${L === 'ar' ? 'مقارنة الأشهر' : 'Month Comparison'}
                </h3>
                <span style="font-size:0.75rem;color:var(--tx3,#64748b);">${monthNames[L][prevM]} vs ${monthNames[L][curM]}</span>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;background:var(--bg,#0f172a);">
                <div style="padding:20px;border-left:1px solid var(--bd,rgba(255,255,255,0.08));">
                    <div style="font-size:0.7rem;color:var(--tx3,#64748b);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">${L === 'ar' ? 'مبيعات الشهر الحالي' : 'Current Month Sales'}</div>
                    <div style="font-size:1.5rem;font-weight:800;color:var(--tx1,#f1f5f9);margin-bottom:4px;">${fmtNum(curSales)}</div>
                    <div style="font-size:0.7rem;color:var(--tx3,#64748b);">vs ${fmtNum(prevSales)} ${L === 'ar' ? 'الشهر الماضي' : 'last month'}</div>
                    <div style="margin-top:8px;">${growthBadge(salesGrowth)}</div>
                </div>
                <div style="padding:20px;">
                    <div style="font-size:0.7rem;color:var(--tx3,#64748b);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">${L === 'ar' ? 'عدد الفواتير الحالي' : 'Current Month Orders'}</div>
                    <div style="font-size:1.5rem;font-weight:800;color:var(--tx1,#f1f5f9);margin-bottom:4px;">${curOrders.size}</div>
                    <div style="font-size:0.7rem;color:var(--tx3,#64748b);">vs ${prevOrders.size} ${L === 'ar' ? 'الشهر الماضي' : 'last month'}</div>
                    <div style="margin-top:8px;">${growthBadge(ordersGrowth)}</div>
                </div>
            </div>
        `;

        M.insertBefore(card, M.firstChild);
    }

    (function initFocusMode() {

            }

                text-align: center;

        `;
        document.head.appendChild(style);

        // Add focus button to sidebar top bar
        function addFocusBtn() {
            let sbb = document.querySelector('.sbb');
            if (!sbb || document.getElementById('sp-focus-btn')) return;
            let btn = document.createElement('button');
            btn.id = 'sp-focus-btn';
            btn.title = 'Focus Mode';
            btn.innerHTML = '⏱️';
            btn.style.cssText = 'background:none;border:none;cursor:pointer;font-size:1rem;padding:4px;border-radius:6px;';
            sbb.insertBefore(btn, sbb.firstChild);
            btn.onclick = toggleFocusMode;
        }

        window.toggleFocusMode = function () {
            let overlay = document.getElementById('sp-focus-overlay');
            if (overlay && overlay.classList.contains('active')) {
                overlay.classList.remove('active');
                setTimeout(() => overlay.remove(), 400);
                document.getElementById('sp-focus-btn').innerHTML = '⏱️';
                document.getElementById('sp-focus-btn').title = 'Focus Mode';
                return;
            }

            let L = getLang();

            let T_data = getTargets();
            let sMap = {};
            S_data.forEach(r => {
                let v = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
                sMap[r.Customer || ''] = (sMap[r.Customer || ''] || 0) + v;
            });
            let totalTarget = 0, totalAchieved = 0;
            T_data.forEach(r => { totalTarget += Number(r.Target || 0); totalAchieved += sMap[r.Customer || ''] || 0; });
            let totalSales = 0;
            S_data.forEach(r => { totalSales += typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0); });

            let ov = document.createElement('div');

            ov.innerHTML = `
                <button onclick="window.toggleFocusMode()" style="position:absolute;top:24px;right:24px;background:rgba(255,255,255,0.1);border:none;color:white;cursor:pointer;font-size:1.5rem;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;">✕</button>

                <div class="sp-focus-kpi">
                    <div style="font-size:0.75rem;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;">${L === 'ar' ? 'إجمالي المبيعات' : 'Total Sales'}</div>
                    <div style="font-size:clamp(3rem,8vw,6rem);font-weight:900;color:white;line-height:1;">${fmtNum(totalSales)}</div>
                </div>
                <div class="sp-focus-kpi" style="animation-delay:0.1s;">
                    <div style="font-size:0.75rem;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;">${L === 'ar' ? 'نسبة إنجاز التارجت' : 'Target Achievement'}</div>
                    <div style="background:rgba(255,255,255,0.1);border-radius:50px;height:16px;width:min(400px,80vw);overflow:hidden;">
                        <div style="height:100%;width:${pct.toFixed(1)}%;background:linear-gradient(90deg,#10b981,#3b82f6);border-radius:50px;transition:width 1.5s;"></div>
                    </div>
                    <div style="font-size:2rem;font-weight:800;color:#10b981;margin-top:10px;">${pct.toFixed(1)}%</div>
                </div>
            `;
            document.body.appendChild(ov);
            requestAnimationFrame(() => ov.classList.add('active'));
            document.getElementById('sp-focus-btn').innerHTML = '✕';
        };

        // Try to add button now and after renders
        setTimeout(addFocusBtn, 1000);
        let origBuildNav = window.buildNav;
        window.buildNav = function () {
            if (origBuildNav) origBuildNav();
            setTimeout(addFocusBtn, 100);
        };
    })();

            .sp-notif-item:hover { background: rgba(255,255,255,0.04); }
            .sp-notif-item:last-child { border-bottom: none; }
        `;
        document.head.appendChild(styleEl);

        function calcNotifications() {
            let notifs = [];
            let L = getLang();
            let S_data = getSales();
            let T_data = getTargets();
            let Todo_data = getTodos();

            // 1. Dormant customers (30+ days)
            let latestByCustomer = {};
            S_data.forEach(r => {
                let d = parseDate(r['Invoice Date'] || r['Order Date'] || r['Date']);
                let c = r.Customer;
                if (d && c) {
                    if (!latestByCustomer[c] || d > latestByCustomer[c]) latestByCustomer[c] = d;
                }
            });
            let dormantCount = 0;
            let today = new Date();
            Object.values(latestByCustomer).forEach(d => {
                if (Math.floor((today - d) / 86400000) >= 30) dormantCount++;
            });
            if (dormantCount > 0) {
                notifs.push({ icon: '💤', color: '#ef4444', text: L === 'ar' ? `${dormantCount} عميل خامل منذ 30+ يوم` : `${dormantCount} customers dormant 30+ days`, page: 'dormant' });
            }

            // 2. Customers near target (90%+)
            let sMap = {};
            S_data.forEach(r => { let c = r.Customer || ''; let v = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0); sMap[c] = (sMap[c] || 0) + v; });
            let nearCount = 0, overCount = 0;
            T_data.forEach(r => {
                let tg = Number(r.Target || 0);
                let ach = sMap[r.Customer || ''] || 0;
                let p = tg > 0 ? ach / tg * 100 : 0;
                if (p >= 100) overCount++;
                else if (p >= 90) nearCount++;
            });
            if (overCount > 0) notifs.push({ icon: '🏆', color: '#10b981', text: L === 'ar' ? `${overCount} عميل حقق التارجت 100%!` : `${overCount} customers hit 100% target!`, page: 'targets' });
            if (nearCount > 0) notifs.push({ icon: '🎯', color: '#3b82f6', text: L === 'ar' ? `${nearCount} عملاء قريبون من الهدف (90%+)` : `${nearCount} customers near target (90%+)`, page: 'targets' });

            // 3. Overdue todos
            let overdueTodos = Todo_data.filter(t => !t.done && t.dueDate && new Date(t.dueDate) < today);
            if (overdueTodos.length > 0) notifs.push({ icon: '📋', color: '#f59e0b', text: L === 'ar' ? `${overdueTodos.length} مهمة متأخرة` : `${overdueTodos.length} overdue tasks`, page: 'todo' });

            // 4. Today's activity summary
            let todaySales = S_data.filter(r => { let d = parseDate(r['Invoice Date'] || r['Order Date'] || r['Date']); return d && d.toISOString().split('T')[0] === todayStr(); });
            if (todaySales.length > 0) notifs.push({ icon: '🧾', color: '#8b5cf6', text: L === 'ar' ? `${todaySales.length} فاتورة مسجلة اليوم` : `${todaySales.length} invoices today`, page: 'today' });

            return notifs;
        }

        function addNotifBtn() {
            let sbb = document.querySelector('.sbb');
            if (!sbb || document.getElementById('sp-notif-btn')) return;

            let notifs = calcNotifications();
            let btn = document.createElement('button');
            btn.id = 'sp-notif-btn';
            btn.title = 'Notifications';
            btn.innerHTML = `🔔${notifs.length > 0 ? `<span id="sp-notif-badge">${notifs.length > 9 ? '9+' : notifs.length}</span>` : ''}`;
            sbb.insertBefore(btn, sbb.firstChild);

            // Dropdown
            let dd = document.createElement('div');
            dd.id = 'sp-notif-dropdown';
            let L = getLang();
            dd.innerHTML = `
                <div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;">
                    <span style="font-weight:700;font-size:0.95rem;">🔔 ${L === 'ar' ? 'الإشعارات' : 'Notifications'}</span>
                    <span style="font-size:0.75rem;color:var(--tx3,#64748b);">${notifs.length} ${L === 'ar' ? 'إشعار' : 'alerts'}</span>
                </div>
                ${notifs.length === 0
                    ? `<div style="text-align:center;padding:30px;color:var(--tx3,#64748b);">✅ ${L === 'ar' ? 'كل شيء على ما يرام!' : 'All clear!'}</div>`
                    : notifs.map(n => `
                        <div class="sp-notif-item" onclick="if(typeof window.nav==='function') window.nav('${n.page}'); else { window.P='${n.page}'; if(typeof buildNav==='function') buildNav(); if(typeof render==='function') render(); } document.getElementById('sp-notif-dropdown').classList.remove('open');">
                            <div style="display:flex;align-items:flex-start;gap:12px;">
                                <span style="font-size:1.3rem;line-height:1;">${n.icon}</span>
                                <div>
                                    <div style="font-size:0.85rem;font-weight:500;color:var(--tx1,#f1f5f9);">${n.text}</div>
                                    <div style="font-size:0.7rem;color:${n.color};margin-top:3px;">${L === 'ar' ? 'اضغط للعرض' : 'Tap to view'} →</div>
                                </div>
                            </div>
                        </div>`).join('')
                }
            `;
            document.body.appendChild(dd);

            btn.onclick = (e) => {
                e.stopPropagation();
                dd.classList.toggle('open');
            };
            document.addEventListener('click', () => dd.classList.remove('open'));
        }

        setTimeout(addNotifBtn, 1200);
        let origBuildNavNotif = window.buildNav;
        window.buildNav = function () {
            if (origBuildNavNotif) origBuildNavNotif();
            setTimeout(() => {
                let existing = document.getElementById('sp-notif-btn');
                if (existing) existing.remove();
                let existingDd = document.getElementById('sp-notif-dropdown');
                if (existingDd) existingDd.remove();
                addNotifBtn();
            }, 150);
        };
    })();

    // ──────────────────────────────────────────────────────────────────────────
    // FEATURE 6: Mobile Quick Actions (FAB + Bottom Nav enhancement)
    // ──────────────────────────────────────────────────────────────────────────
    (function initMobileQuickActions() {
        let style = document.createElement('style');
        style.innerHTML = `
            #sp-fab {
                position: fixed; bottom: 80px; left: 20px;
                z-index: 999;
                display: none;
            }
            body.en #sp-fab { left: auto; right: 20px; }
            @media (max-width: 900px) { #sp-fab { display: block; } }
            #sp-fab-main {
                width: 54px; height: 54px; border-radius: 50%;
                background: var(--am, #5046e5); color: white;
                border: none; font-size: 1.5rem; cursor: pointer;
                box-shadow: 0 4px 20px rgba(80,70,229,0.4);
                display: flex; align-items: center; justify-content: center;
                transition: all 0.2s; position: relative; z-index: 2;
            }
            #sp-fab-main:hover { transform: scale(1.08); }
            #sp-fab-main.open { transform: rotate(45deg); background: #ef4444; }
            #sp-fab-actions {
                position: absolute; bottom: 60px; left: 0;
                display: flex; flex-direction: column; gap: 8px; align-items: center;
                opacity: 0; pointer-events: none;
                transition: all 0.3s cubic-bezier(.4,0,.2,1);
                transform: translateY(10px);
            }
            #sp-fab-actions.open { opacity: 1; pointer-events: all; transform: translateY(0); }
            .sp-fab-action {
                background: var(--bg2, #1e293b); border: 1px solid var(--bd, rgba(255,255,255,0.1));
                border-radius: 12px; padding: 10px 14px;
                display: flex; align-items: center; gap: 8px; cursor: pointer;
                box-shadow: 0 4px 16px rgba(0,0,0,0.3);
                white-space: nowrap; font-size: 0.85rem; font-weight: 600;
                color: var(--tx1, #f1f5f9); transition: all 0.15s;
            }
            .sp-fab-action:hover { background: var(--am, #5046e5); color: white; }
        `;
        document.head.appendChild(style);

        function addFAB() {
            if (document.getElementById('sp-fab')) return;
            let L = getLang();
            let fab = document.createElement('div');
            fab.id = 'sp-fab';
            fab.innerHTML = `
                <div id="sp-fab-actions">
                    <div class="sp-fab-action" onclick="closeFAB();if(typeof addVisitModal==='function')addVisitModal();">
                        <span>🚗</span> <span>${L === 'ar' ? 'زيارة جديدة' : 'New Visit'}</span>
                    </div>
                    <div class="sp-fab-action" onclick="closeFAB();window.P='today';if(typeof buildNav==='function')buildNav();if(typeof render==='function')render();if(typeof rToday==='function')rToday();">
                        <span>📅</span> <span>${L === 'ar' ? 'سجل اليوم' : 'Daily Feed'}</span>
                    </div>
                    <div class="sp-fab-action" onclick="closeFAB();window.P='alerts';if(typeof buildNav==='function')buildNav();if(typeof render==='function')render();">
                        <span>🔔</span> <span>${L === 'ar' ? 'التنبيهات' : 'Alerts'}</span>
                    </div>
                </div>
                <button id="sp-fab-main" onclick="toggleFAB()">＋</button>
            `;
            document.body.appendChild(fab);
        }

        window.toggleFAB = function () {
            let main = document.getElementById('sp-fab-main');
            let actions = document.getElementById('sp-fab-actions');
            if (!main || !actions) return;
            main.classList.toggle('open');
            actions.classList.toggle('open');
        };

        window.closeFAB = function () {
            let main = document.getElementById('sp-fab-main');
            let actions = document.getElementById('sp-fab-actions');
            if (main) main.classList.remove('open');
            if (actions) actions.classList.remove('open');
        };

        setTimeout(addFAB, 1500);
    })();

    // ──────────────────────────────────────────────────────────────────────────
    // Hook into existing render cycle
    // ──────────────────────────────────────────────────────────────────────────
    (function hookRender() {
        // Add 'today' page to NAV
        function addTodayNav() {
            if (typeof NAV !== 'undefined' && !NAV.find(n => n.p === 'today')) {
                let dashIdx = NAV.findIndex(n => n.p === 'dash');
                if (dashIdx > -1) {
                    NAV.splice(dashIdx + 1, 0, { p: 'today', ic: '📅' });
                }
            }
        }
        addTodayNav();

        // Extend render to support 'today' page and inject KPI banner on dash
        let origRender = window.render;
        window.render = function () {
            if (typeof P !== 'undefined') {
                if (P === 'today') {
                    if (typeof buildNav === 'function') buildNav();
                    window.rToday();
                    return;
                }
            }
            if (origRender) origRender();
            // Inject KPI Banner after dashboard renders
            if (typeof P !== 'undefined' && P === 'dash') {
                setTimeout(injectKPIBanner, 300);
            }
            // Inject MoM on analytics
            if (typeof P !== 'undefined' && P === 'analytics') {
                setTimeout(injectMoMComparison, 300);
            }
        };

        // Extend buildNav to label 'today'
        let origBN = window.buildNav;
        window.buildNav = function () {
            if (origBN) origBN();
            setTimeout(() => {
                let L = getLang();
                let el = document.querySelector('.ni[data-p="today"] span:nth-child(2)');
                if (el) el.textContent = L === 'ar' ? 'سجل اليوم' : 'Daily Feed';
            }, 60);
        };
    })();

})();

</script>
<script>
// ============================================================
// quick_search.js — Sales Pro Global Quick Search (Ctrl+K)
// Opens a floating search modal on Ctrl+K or search button click.
// Searches across: customers, invoices, products, pages.
// Safe injection — no existing code modified.
// ============================================================

(function () {
    'use strict';

    // ─── Inject CSS ────────────────────────────────────────────────────────────
    let style = document.createElement('style');
    style.id = 'sp-qs-css';
    style.innerHTML = `
        #sp-qs-overlay {
            position: fixed; inset: 0; z-index: 99999;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            display: flex; align-items: flex-start; justify-content: center;
            padding-top: clamp(60px, 12vh, 120px);

        #sp-qs-overlay.open { opacity: 1; pointer-events: all; }
        #sp-qs-box {
            width: min(600px, 92vw);
            background: var(--bg2, #1e293b);

            transform: translateY(-16px) scale(0.97);
            transition: transform 0.25s cubic-bezier(.4,0,.2,1);
        }
        #sp-qs-overlay.open #sp-qs-box { transform: translateY(0) scale(1); }
        #sp-qs-input-wrap {
            display: flex; align-items: center; gap: 12px;

        }
        #sp-qs-input {
            flex: 1; background: none; border: none; outline: none;
            font-size: 1.1rem; color: var(--tx1, #f1f5f9);
            font-family: inherit;
            caret-color: var(--am, #5046e5);
        }
        #sp-qs-input::placeholder { color: var(--tx3, #64748b); }
        #sp-qs-clear { background: none; border: none; cursor: pointer; color: var(--tx3, #64748b); font-size: 1.1rem; padding: 4px; border-radius: 6px; transition: color 0.15s; }
        #sp-qs-clear:hover { color: var(--tx1, #f1f5f9); }
        #sp-qs-results {
            max-height: 420px; overflow-y: auto;
        }
        #sp-qs-results::-webkit-scrollbar { width: 4px; }
        #sp-qs-results::-webkit-scrollbar-track { background: transparent; }
        #sp-qs-results::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
        .sp-qs-section-label {
            padding: 8px 20px 4px;
            font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--tx3, #64748b); font-weight: 700;
        }
        .sp-qs-result {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 20px; cursor: pointer;
            transition: background 0.12s; border-radius: 8px;
            margin: 0 8px 2px;
        }
        .sp-qs-result:hover, .sp-qs-result.selected {
            background: rgba(80,70,229,0.15);
        }
        .sp-qs-result-icon {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0;
        }
        .sp-qs-result-main { flex: 1; min-width: 0; }
        .sp-qs-result-title { font-weight: 600; font-size: 0.9rem; color: var(--tx1, #f1f5f9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sp-qs-result-sub { font-size: 0.75rem; color: var(--tx3, #64748b); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sp-qs-result-badge {
            font-size: 0.7rem; font-weight: 700; padding: 3px 8px;
            border-radius: 20px; flex-shrink: 0;
        }
        .sp-qs-empty {
            text-align: center; padding: 40px 20px;
            color: var(--tx3, #64748b); font-size: 0.9rem;
        }
        #sp-qs-footer {
            padding: 10px 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; gap: 16px;
            font-size: 0.7rem; color: var(--tx3, #64748b);
        }
        .sp-qs-key {
            background: rgba(255,255,255,0.08); border-radius: 5px;
            padding: 2px 6px; font-size: 0.68rem; font-family: monospace;
            border: 1px solid rgba(255,255,255,0.12);
        }
        #sp-qs-search-btn {
            background: none; border: none; cursor: pointer;
            color: var(--tx2, #94a3b8); font-size: 1rem; padding: 4px 6px;
            border-radius: 6px; transition: all 0.2s; display: flex; align-items: center; gap: 4px;
        }
        #sp-qs-search-btn:hover { background: rgba(255,255,255,0.08); color: var(--tx1,#f1f5f9); }
    `;
    document.head.appendChild(style);

    // ─── Build search data ─────────────────────────────────────────────────────
    function buildIndex() {
        let L = localStorage.getItem('sp_lang') || 'ar';
        let S_data = [];
        let T_data = [];
        try { S_data = JSON.parse(localStorage.getItem('salesData') || '[]'); } catch(e) {}
        try { T_data = JSON.parse(localStorage.getItem('targetData') || '[]'); } catch(e) {}

        let results = [];

        // Pages
        let pages = [
            { icon: '🏠', title: L === 'ar' ? 'لوحة التحكم' : 'Dashboard', page: 'dash', color: '#5046e5' },
            { icon: '💰', title: L === 'ar' ? 'المبيعات' : 'Sales', page: 'sales', color: '#10b981' },
            { icon: '🎯', title: L === 'ar' ? 'تارجت العملاء' : 'Targets', page: 'targets', color: '#f59e0b' },
            { icon: '🏪', title: L === 'ar' ? 'العملاء' : 'Customers', page: 'customers', color: '#3b82f6' },
            { icon: '📅', title: L === 'ar' ? 'سجل اليوم' : 'Daily Feed', page: 'today', color: '#8b5cf6' },
            { icon: '📋', title: L === 'ar' ? 'المهام' : 'To-Do', page: 'todo', color: '#06b6d4' },
            { icon: '🚗', title: L === 'ar' ? 'الزيارات' : 'Visits', page: 'visits', color: '#f97316' },
            { icon: '🤝', title: L === 'ar' ? 'محتملين' : 'Leads', page: 'leads', color: '#ec4899' },
            { icon: '🧠', title: L === 'ar' ? 'التحليلات' : 'Analytics', page: 'analytics', color: '#a78bfa' },
            { icon: '💵', title: L === 'ar' ? 'هامش الربح' : 'Profit', page: 'profit', color: '#34d399' },
            { icon: '⭐', title: L === 'ar' ? 'المميزين' : 'Key Accounts', page: 'keyacc', color: '#fbbf24' },
            { icon: '💤', title: L === 'ar' ? 'الخاملين' : 'Dormant', page: 'dormant', color: '#ef4444' },
            { icon: '🔔', title: L === 'ar' ? 'التنبيهات' : 'Alerts', page: 'alerts', color: '#f59e0b' },
            { icon: '⚙️', title: L === 'ar' ? 'الإعدادات' : 'Settings', page: 'settings', color: '#64748b' },
        ];
        pages.forEach(p => results.push({ type: 'page', ...p }));

        // Customers (unique from sales + targets)
        let customers = new Set();
        S_data.forEach(r => { if (r.Customer) customers.add(r.Customer); });
        T_data.forEach(r => { if (r.Customer) customers.add(r.Customer); });
        customers.forEach(c => {
            let sTotal = 0;
            S_data.filter(r => r.Customer === c).forEach(r => {
                sTotal += typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
            });
            results.push({ type: 'customer', icon: '🏪', title: c, sub: `${L === 'ar' ? 'إجمالي المبيعات:' : 'Total Sales:'} ${sTotal >= 1000 ? (sTotal/1000).toFixed(1)+'K' : Math.round(sTotal)}`, page: 'customers', color: '#3b82f6', value: sTotal });
        });

        // Products / Items (unique)
        let items = {};
        S_data.forEach(r => {
            let name = r['Item Description'] || r['Item Class Name'];
            if (name) {
                items[name] = (items[name] || 0) + (typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0));
            }
        });
        Object.entries(items).slice(0, 200).forEach(([name, val]) => {
            results.push({ type: 'product', icon: '📦', title: name, sub: `${L === 'ar' ? 'مبيعات:' : 'Sales:'} ${val >= 1000 ? (val/1000).toFixed(1)+'K' : Math.round(val)}`, page: 'sales', color: '#10b981', value: val });
        });

        return results;
    }

    // ─── Search Logic ──────────────────────────────────────────────────────────
    let allItems = [];
    let selectedIdx = 0;

    function doSearch(q) {
        if (!q || q.trim().length === 0) return getRecent();
        let lower = q.toLowerCase();
        return allItems
            .filter(r => r.title.toLowerCase().includes(lower) || (r.sub || '').toLowerCase().includes(lower))
            .sort((a, b) => {
                let aS = a.title.toLowerCase().startsWith(lower) ? 0 : 1;
                let bS = b.title.toLowerCase().startsWith(lower) ? 0 : 1;
                return aS - bS || (b.value || 0) - (a.value || 0);
            })
            .slice(0, 20);
    }

    function getRecent() {
        let L = localStorage.getItem('sp_lang') || 'ar';
        let pages = allItems.filter(r => r.type === 'page').slice(0, 6);
        let topCustomers = allItems.filter(r => r.type === 'customer').sort((a,b) => (b.value||0)-(a.value||0)).slice(0,4);
        return [...pages, ...topCustomers];
    }

    function highlight(text, q) {
        if (!q) return text;
        let idx = text.toLowerCase().indexOf(q.toLowerCase());
        if (idx === -1) return text;
        return text.slice(0, idx) + `<mark style="background:rgba(80,70,229,0.4);color:inherit;border-radius:2px;">${text.slice(idx, idx + q.length)}</mark>` + text.slice(idx + q.length);
    }

    function renderResults(items, q) {
        let L = localStorage.getItem('sp_lang') || 'ar';
        let resultsEl = document.getElementById('sp-qs-results');
        if (!resultsEl) return;
        selectedIdx = 0;

        if (items.length === 0) {
            resultsEl.innerHTML = `<div class="sp-qs-empty">🔍 ${L === 'ar' ? 'لا توجد نتائج لـ' : 'No results for'} "${q}"</div>`;
            return;
        }

        let grouped = {};
        items.forEach(r => {
            if (!grouped[r.type]) grouped[r.type] = [];
            grouped[r.type].push(r);
        });

        let typeLabels = { page: L === 'ar' ? 'الصفحات' : 'Pages', customer: L === 'ar' ? 'العملاء' : 'Customers', product: L === 'ar' ? 'المنتجات' : 'Products' };
        let html = '';
        let itemIdx = 0;

        Object.entries(grouped).forEach(([type, group]) => {
            html += `<div class="sp-qs-section-label">${typeLabels[type] || type}</div>`;
            group.forEach(item => {
                let badge = type === 'page' ? `<span class="sp-qs-result-badge" style="background:${item.color}22;color:${item.color};">${L === 'ar' ? 'صفحة' : 'page'}</span>` :
                            type === 'customer' ? `<span class="sp-qs-result-badge" style="background:rgba(59,130,246,0.15);color:#3b82f6;">${L === 'ar' ? 'عميل' : 'customer'}</span>` :
                            `<span class="sp-qs-result-badge" style="background:rgba(16,185,129,0.15);color:#10b981;">${L === 'ar' ? 'منتج' : 'product'}</span>`;
                html += `
                    <div class="sp-qs-result${itemIdx === 0 ? ' selected' : ''}" data-idx="${itemIdx}" data-page="${item.page}" data-customer="${type === 'customer' ? item.title : ''}" onclick="spQsNavigate(this)">
                        <div class="sp-qs-result-icon" style="background:${item.color}22;">${item.icon}</div>
                        <div class="sp-qs-result-main">
                            <div class="sp-qs-result-title">${highlight(item.title, q)}</div>
                            ${item.sub ? `<div class="sp-qs-result-sub">${item.sub}</div>` : ''}
                        </div>
                        ${badge}
                    </div>`;
                itemIdx++;
            });
        });

        resultsEl.innerHTML = html;
    }

    // ─── Navigation ────────────────────────────────────────────────────────────
    window.spQsNavigate = function (el) {
        let page = el.getAttribute('data-page');
        let customer = el.getAttribute('data-customer');
        closeSearch();
        if (page) {
            if (typeof window.P !== 'undefined') window.P = page;
            if (typeof buildNav === 'function') buildNav();
            if (typeof render === 'function') render();
            // Special: if it's a customer search, try to open customer profile
            if (customer && typeof window.openCustomerProfile === 'function') {
                setTimeout(() => window.openCustomerProfile(customer), 300);
            }
        }
    };

    // ─── Keyboard navigation ───────────────────────────────────────────────────
    function moveSelection(dir) {
        let items = document.querySelectorAll('.sp-qs-result');
        if (!items.length) return;
        items[selectedIdx]?.classList.remove('selected');
        selectedIdx = Math.max(0, Math.min(items.length - 1, selectedIdx + dir));
        items[selectedIdx]?.classList.add('selected');
        items[selectedIdx]?.scrollIntoView({ block: 'nearest' });
    }

    // ─── Open / Close ──────────────────────────────────────────────────────────
    function openSearch() {
        allItems = buildIndex();
        let overlay = document.getElementById('sp-qs-overlay');
        if (!overlay) return;
        overlay.classList.add('open');
        setTimeout(() => {
            let inp = document.getElementById('sp-qs-input');
            if (inp) { inp.focus(); inp.value = ''; }
            renderResults(getRecent(), '');
        }, 50);
    }

    function closeSearch() {
        let overlay = document.getElementById('sp-qs-overlay');
        if (overlay) overlay.classList.remove('open');
    }

    // ─── Build DOM ─────────────────────────────────────────────────────────────
    function buildSearchUI() {
        if (document.getElementById('sp-qs-overlay')) return;
        let L = localStorage.getItem('sp_lang') || 'ar';

        let overlay = document.createElement('div');
        overlay.id = 'sp-qs-overlay';
        overlay.innerHTML = `
            <div id="sp-qs-box">
                <div id="sp-qs-input-wrap">
                    <span style="font-size:1.1rem;color:var(--tx3,#64748b);">🔍</span>
                    <input id="sp-qs-input" type="text" placeholder="${L === 'ar' ? 'ابحث عن عميل، منتج، أو صفحة...' : 'Search customers, products, pages...'}" autocomplete="off" spellcheck="false">
                    <button id="sp-qs-clear" onclick="document.getElementById('sp-qs-input').value='';document.getElementById('sp-qs-input').dispatchEvent(new Event('input'));document.getElementById('sp-qs-input').focus();">✕</button>
                </div>
                <div id="sp-qs-results"></div>
                <div id="sp-qs-footer">
                    <span><span class="sp-qs-key">↑↓</span> ${L === 'ar' ? 'تنقل' : 'navigate'}</span>
                    <span><span class="sp-qs-key">Enter</span> ${L === 'ar' ? 'فتح' : 'open'}</span>
                    <span><span class="sp-qs-key">Esc</span> ${L === 'ar' ? 'إغلاق' : 'close'}</span>
                    <span style="margin-right:auto;"><span class="sp-qs-key">Ctrl</span> + <span class="sp-qs-key">K</span></span>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);

        // Close on overlay click
        overlay.addEventListener('click', e => { if (e.target === overlay) closeSearch(); });

        // Input events
        let inp = document.getElementById('sp-qs-input');
        let debounceTimer;
        inp.addEventListener('input', e => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                let q = e.target.value.trim();
                renderResults(doSearch(q), q);
            }, 120);
        });

        inp.addEventListener('keydown', e => {
            if (e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); moveSelection(-1); }
            else if (e.key === 'Enter') {
                e.preventDefault();
                let selected = document.querySelector('.sp-qs-result.selected');
                if (selected) selected.click();
            }
            else if (e.key === 'Escape') closeSearch();
        });
    }

    // ─── Add search button to sidebar ─────────────────────────────────────────
    function addSearchBtn() {
        let sbt = document.querySelector('.sbt, .sbr');
        if (!sbt || document.getElementById('sp-qs-search-btn')) return;
        let L = localStorage.getItem('sp_lang') || 'ar';
        let btn = document.createElement('button');
        btn.id = 'sp-qs-search-btn';
        btn.title = L === 'ar' ? 'بحث سريع (Ctrl+K)' : 'Quick Search (Ctrl+K)';
        btn.innerHTML = `<span>🔍</span><span style="font-size:0.65rem;opacity:0.6;">Ctrl+K</span>`;
        btn.onclick = openSearch;

        // Insert into sidebar top area
        let sbTitleEl = document.querySelector('.sbt');
        if (sbTitleEl) sbTitleEl.appendChild(btn);
    }

    // ─── Keyboard shortcut ─────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            let overlay = document.getElementById('sp-qs-overlay');
            if (overlay && overlay.classList.contains('open')) {
                closeSearch();
            } else {
                openSearch();
            }
        }
        if (e.key === 'Escape') {
            let overlay = document.getElementById('sp-qs-overlay');
            if (overlay && overlay.classList.contains('open')) closeSearch();
        }
    });

    // ─── Initialize ────────────────────────────────────────────────────────────
    function init() {
        buildSearchUI();
        addSearchBtn();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(init, 1000));
    } else {
        setTimeout(init, 1000);
    }

    // Re-add search button on nav rebuild
    let _origBNQS = window.buildNav;
    window.buildNav = function () {
        if (_origBNQS) _origBNQS();
        setTimeout(addSearchBtn, 200);
    };

    window.spOpenSearch = openSearch;
    window.spCloseSearch = closeSearch;

})();

</script>
<script>
// ============================================================
// customer_reports.js — Sales Pro Professional Customer PDF Reports
// Adds "Print Report" button to Targets & Customers pages.
// Uses pdfmake (already loaded in index.html).
// Safe injection — no existing code modified.
// ============================================================

(function () {
    'use strict';

    // ─── Helpers ───────────────────────────────────────────────────────────────
    function getLang() { return localStorage.getItem('sp_lang') || 'ar'; }

    function getSalesData() {
        try { return JSON.parse(localStorage.getItem('salesData') || '[]'); } catch(e) { return []; }
    }

    function getTargetData() {
        try { return JSON.parse(localStorage.getItem('targetData') || '[]'); } catch(e) { return []; }
    }

    function getCollectionsData() {
        try { return JSON.parse(localStorage.getItem('payData') || '[]'); } catch(e) { return []; }
    }

    function getVisitsData() {
        try { return JSON.parse(localStorage.getItem('sp_visits') || '[]'); } catch(e) { return []; }
    }

    function parseDate(v) {
        if (!v) return null;
        if (typeof v === 'number') return new Date(Math.round((v - 25569) * 86400 * 1000));
        let d = new Date(v);
        if (!isNaN(d.getTime())) return d;
        if (typeof v === 'string') {
            let p = v.split(/[\/\-]/);
            if (p.length === 3) {
                let y = p[2].length === 2 ? '20' + p[2] : p[2];
                return new Date(`${y}-${('0'+p[1]).slice(-2)}-${('0'+p[0]).slice(-2)}`);
            }
        }
        return null;
    }

    function fmtN(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 }); }

    function fmtDate(d) {
        if (!d) return '-';
        let dt = parseDate(d);
        if (!dt) return String(d);
        return dt.toLocaleDateString('en-GB');
    }

    // ─── Core Report Generator ─────────────────────────────────────────────────
    window.generateCustomerReport = function (customerName) {
        if (typeof pdfMake === 'undefined') {
            alert('PDF library not loaded. Please refresh the page.');
            return;
        }

        let L = getLang();
        let S_data = getSalesData();
        let T_data = getTargetData();
        let C_data = getCollectionsData();
        let V_data = getVisitsData();

        // Filter data for this customer
        let custSales = S_data.filter(r => r.Customer === customerName);
        let custTarget = T_data.find(r => r.Customer === customerName) || {};
        let custVisits = V_data.filter(v => v.customer === customerName);

        // Calculate collections
        let custColTotal = 0;
        C_data.forEach(r => {
            let keys = Object.keys(r);
            let getV = (names) => { let k = keys.find(k => names.some(n => k.toLowerCase().replace(/\s+/g,'') === n.toLowerCase().replace(/\s+/g,''))); return k ? r[k] : null; };
            let cName = getV(['Customer Name','Customer']) || '';
            if (cName === customerName) {
                let rawVal = getV(['Amount','Collection']) || 0;
                custColTotal += Number(rawVal.toString().replace(/,/g,'')) || 0;
            }
        });

        // Totals
        let totalSales = 0, totalProfit = 0;
        custSales.forEach(r => {
            totalSales += typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
            totalProfit += typeof getProfitVal === 'function' ? getProfitVal(r) : Number(r['Profit'] || 0);
        });

        let target = Number(custTarget.Target || 0);
        let pctTarget = target > 0 ? Math.min((totalSales / target) * 100, 100) : 0;
        let due = Math.max(0, totalSales - custColTotal);
        let margin = totalSales > 0 ? (totalProfit / totalSales) * 100 : 0;
        let reportDate = new Date().toLocaleDateString(L === 'ar' ? 'ar-EG' : 'en-GB', { year: 'numeric', month: 'long', day: 'numeric' });

        // Last 10 invoices
        let recentSales = [...custSales]
            .sort((a, b) => {
                let da = parseDate(a['Invoice Date'] || a['Order Date'] || a['Date']);
                let db = parseDate(b['Invoice Date'] || b['Order Date'] || b['Date']);
                return (db || 0) - (da || 0);
            })
            .slice(0, 10);

        // Category breakdown
        let catMap = {};
        custSales.forEach(r => {
            let cat = r['Item Class Name'] || (L === 'ar' ? 'أخرى' : 'Other');
            let v = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
            catMap[cat] = (catMap[cat] || 0) + v;
        });
        let catEntries = Object.entries(catMap).sort((a,b) => b[1]-a[1]).slice(0, 8);

        // Status color
        let statusColor = pctTarget >= 100 ? '#10b981' : pctTarget >= 60 ? '#3b82f6' : '#ef4444';
        let statusText = pctTarget >= 100 ? (L === 'ar' ? 'حقق الهدف ✓' : 'Target Met ✓') :
                         pctTarget >= 60 ? (L === 'ar' ? 'تقدم جيد' : 'Good Progress') :
                         (L === 'ar' ? 'يحتاج متابعة' : 'Needs Follow-up');

        // ─── pdfmake document definition ──────────────────────────────────────
        let dd = {
            pageSize: 'A4',
            pageOrientation: 'portrait',
            pageMargins: [40, 60, 40, 60],
            info: { title: `${customerName} - ${L === 'ar' ? 'تقرير العميل' : 'Customer Report'}` },
            content: [
                // Header
                {
                    columns: [
                        {
                            stack: [
                                { text: 'SALES PRO', style: 'brand', color: '#5046e5' },
                                { text: L === 'ar' ? 'تقرير عميل احترافي' : 'Professional Customer Report', style: 'brandSub', color: '#64748b' },
                            ]
                        },
                        {
                            stack: [
                                { text: reportDate, style: 'headerDate', alignment: 'right', color: '#64748b' },
                                { text: L === 'ar' ? 'سري وخاص' : 'Confidential', style: 'headerDate', alignment: 'right', color: '#ef4444' },
                            ]
                        }
                    ],
                    margin: [0, 0, 0, 16]
                },

                // Divider
                { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 2, lineColor: '#5046e5' }], margin: [0, 0, 0, 20] },

                // Customer Name Banner
                {
                    fillColor: '#0f172a',
                    table: { widths: ['*'], body: [[{
                        stack: [
                            { text: customerName, style: 'customerName', alignment: 'center', color: '#f1f5f9' },
                            { text: statusText, style: 'statusBadge', alignment: 'center', color: statusColor },
                        ],
                        fillColor: '#0f172a', border: [false,false,false,false], margin: [0, 16, 0, 16]
                    }]] },
                    margin: [0, 0, 0, 20]
                },

                // KPI Cards (4 columns)
                {
                    columns: [
                        kpiCard(L === 'ar' ? 'إجمالي المبيعات' : 'Total Sales', fmtN(totalSales), '#10b981'),
                        kpiCard(L === 'ar' ? 'نسبة التارجت' : 'Target %', pctTarget.toFixed(1) + '%', statusColor),
                        kpiCard(L === 'ar' ? 'صافي الربح' : 'Net Profit', fmtN(totalProfit), '#8b5cf6'),
                        kpiCard(L === 'ar' ? 'المتبقي للتحصيل' : 'Outstanding', fmtN(due), due > 0 ? '#ef4444' : '#10b981'),
                    ],
                    columnGap: 8,
                    margin: [0, 0, 0, 20]
                },

                // Target Progress Section
                {
                    table: {
                        widths: ['*'],
                        body: [[{
                            stack: [
                                { text: L === 'ar' ? 'تقدم التارجت' : 'Target Progress', style: 'sectionTitle' },
                                {
                                    table: {
                                        widths: ['*'],
                                        body: [[{
                                            canvas: [{
                                                type: 'rect', x: 0, y: 0, w: 475, h: 14, r: 7, color: '#1e293b'
                                            }, {
                                                type: 'rect', x: 0, y: 0, w: Math.max(14, 475 * pctTarget / 100), h: 14, r: 7, color: statusColor
                                            }],
                                            border: [false,false,false,false]
                                        }]]
                                    },
                                    margin: [0, 6, 0, 8]
                                },
                                {
                                    columns: [
                                        { text: `${L === 'ar' ? 'المحقق' : 'Achieved'}: ${fmtN(totalSales)}`, color: '#64748b', fontSize: 9 },
                                        { text: `${pctTarget.toFixed(1)}%`, alignment: 'center', color: statusColor, bold: true, fontSize: 11 },
                                        { text: `${L === 'ar' ? 'الهدف' : 'Target'}: ${fmtN(target)}`, alignment: 'right', color: '#64748b', fontSize: 9 },
                                    ]
                                }
                            ],
                            fillColor: '#0f172a', border: [false,false,false,false],
                            margin: [16, 12, 16, 12]
                        }]]
                    },
                    margin: [0, 0, 0, 20]
                },

                // Summary stats row
                {
                    columns: [
                        {
                            stack: [
                                { text: L === 'ar' ? 'ملخص إضافي' : 'Summary', style: 'sectionTitle' },
                                {
                                    table: {
                                        widths: ['*', '*'],
                                        body: [
                                            [summaryCell(L === 'ar' ? 'عدد الفواتير' : 'Invoices', custSales.length), summaryCell(L === 'ar' ? 'متوسط الفاتورة' : 'Avg Invoice', fmtN(custSales.length > 0 ? totalSales/custSales.length : 0))],
                                            [summaryCell(L === 'ar' ? 'إجمالي التحصيل' : 'Collections', fmtN(custColTotal)), summaryCell(L === 'ar' ? 'هامش الربح' : 'Margin', margin.toFixed(1) + '%')],
                                            [summaryCell(L === 'ar' ? 'عدد الزيارات' : 'Visits', custVisits.length), summaryCell(L === 'ar' ? 'متبقي' : 'Outstanding Due', fmtN(due))],
                                        ]
                                    },
                                    layout: { hLineColor: () => '#1e293b', vLineColor: () => '#1e293b', hLineWidth: () => 1, vLineWidth: () => 1 }
                                }
                            ]
                        }
                    ],
                    margin: [0, 0, 0, 20]
                },

                // Category breakdown
                catEntries.length > 0 ? [
                    { text: L === 'ar' ? 'توزيع المبيعات حسب الفئة' : 'Sales by Category', style: 'sectionTitle' },
                    {
                        table: {
                            widths: ['*', 80, 60],
                            headerRows: 1,
                            body: [
                                [
                                    { text: L === 'ar' ? 'الفئة' : 'Category', style: 'tableHeader' },
                                    { text: L === 'ar' ? 'المبيعات' : 'Sales', style: 'tableHeader', alignment: 'right' },
                                    { text: '%', style: 'tableHeader', alignment: 'right' },
                                ],
                                ...catEntries.map(([cat, val]) => [
                                    { text: cat, fontSize: 9, color: '#e2e8f0' },
                                    { text: fmtN(val), fontSize: 9, alignment: 'right', color: '#10b981', bold: true },
                                    { text: totalSales > 0 ? (val/totalSales*100).toFixed(1) + '%' : '0%', fontSize: 9, alignment: 'right', color: '#64748b' },
                                ])
                            ]
                        },
                        layout: { hLineColor: () => '#1e293b', vLineColor: () => '#1e293b', hLineWidth: () => 1, vLineWidth: () => 1, fillColor: (i) => i === 0 ? '#1e293b' : (i % 2 === 0 ? '#0f172a' : 'transparent') },
                        margin: [0, 0, 0, 20]
                    }
                ] : [],

                // Recent invoices table
                recentSales.length > 0 ? [
                    { text: L === 'ar' ? 'آخر 10 فواتير' : 'Last 10 Invoices', style: 'sectionTitle' },
                    {
                        table: {
                            widths: [60, '*', 80, 70],
                            headerRows: 1,
                            body: [
                                [
                                    { text: L === 'ar' ? 'التاريخ' : 'Date', style: 'tableHeader' },
                                    { text: L === 'ar' ? 'المنتج' : 'Product', style: 'tableHeader' },
                                    { text: L === 'ar' ? 'المبيعات' : 'Sales', style: 'tableHeader', alignment: 'right' },
                                    { text: L === 'ar' ? 'الربح' : 'Profit', style: 'tableHeader', alignment: 'right' },
                                ],
                                ...recentSales.map(r => {
                                    let sv = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax'] || 0);
                                    let pv = typeof getProfitVal === 'function' ? getProfitVal(r) : Number(r['Profit'] || 0);
                                    return [
                                        { text: fmtDate(r['Invoice Date'] || r['Order Date'] || r['Date']), fontSize: 8, color: '#94a3b8' },
                                        { text: (r['Item Description'] || r['Item Class Name'] || '-').slice(0, 40), fontSize: 8, color: '#e2e8f0' },
                                        { text: fmtN(sv), fontSize: 8, alignment: 'right', color: '#10b981', bold: true },
                                        { text: fmtN(pv), fontSize: 8, alignment: 'right', color: '#8b5cf6' },
                                    ];
                                })
                            ]
                        },
                        layout: { hLineColor: () => '#1e293b', vLineColor: () => '#1e293b', hLineWidth: () => 1, vLineWidth: () => 1, fillColor: (i) => i === 0 ? '#1e293b' : (i % 2 === 0 ? '#0f172a' : 'transparent') },
                        margin: [0, 0, 0, 20]
                    }
                ] : [],

                // Visits
                custVisits.length > 0 ? [
                    { text: L === 'ar' ? 'سجل الزيارات' : 'Visit History', style: 'sectionTitle' },
                    {
                        table: {
                            widths: [60, '*', 70],
                            headerRows: 1,
                            body: [
                                [
                                    { text: L === 'ar' ? 'التاريخ' : 'Date', style: 'tableHeader' },
                                    { text: L === 'ar' ? 'الملاحظات' : 'Notes', style: 'tableHeader' },
                                    { text: L === 'ar' ? 'الزيارة القادمة' : 'Next Visit', style: 'tableHeader' },
                                ],
                                ...custVisits.slice(0, 5).map(v => [
                                    { text: v.date || '-', fontSize: 8, color: '#94a3b8' },
                                    { text: (v.outcome || '-').slice(0, 60), fontSize: 8, color: '#e2e8f0' },
                                    { text: v.nextDate || '-', fontSize: 8, color: '#f59e0b' },
                                ])
                            ]
                        },
                        layout: { hLineColor: () => '#1e293b', vLineColor: () => '#1e293b', hLineWidth: () => 1, vLineWidth: () => 1, fillColor: (i) => i === 0 ? '#1e293b' : 'transparent' },
                        margin: [0, 0, 0, 20]
                    }
                ] : [],

                // Footer
                { canvas: [{ type: 'line', x1: 0, y1: 0, x2: 515, y2: 0, lineWidth: 1, lineColor: '#1e293b' }], margin: [0, 10, 0, 8] },
                {
                    columns: [
                        { text: `Sales Pro Enterprise — ${L === 'ar' ? 'تم إنشاؤه بتاريخ' : 'Generated'} ${reportDate}`, color: '#64748b', fontSize: 8 },
                        { text: L === 'ar' ? 'تقرير سري — لا يُشارك' : 'Confidential — Do not distribute', alignment: 'right', color: '#64748b', fontSize: 8 }
                    ]
                }
            ],

            styles: {
                brand: { fontSize: 22, bold: true, letterSpacing: 3 },
                brandSub: { fontSize: 9, letterSpacing: 1 },
                headerDate: { fontSize: 9 },
                customerName: { fontSize: 22, bold: true, margin: [0, 4, 0, 4] },
                statusBadge: { fontSize: 11, bold: true },
                sectionTitle: { fontSize: 11, bold: true, color: '#94a3b8', margin: [0, 0, 0, 8], letterSpacing: 1 },
                tableHeader: { fontSize: 8, bold: true, color: '#94a3b8', fillColor: '#1e293b' },
                kpiLabel: { fontSize: 7.5, color: '#64748b', margin: [0, 0, 0, 2] },
                kpiValue: { fontSize: 14, bold: true },
            },

            background: { canvas: [{ type: 'rect', x: 0, y: 0, w: 595, h: 842, color: '#030712' }] },
            defaultStyle: { font: 'Roboto', fontSize: 10, color: '#f1f5f9', lineHeight: 1.4 }
        };

        let filename = `${customerName.replace(/\s+/g, '_')}_Report_${new Date().toISOString().split('T')[0]}.pdf`;
        pdfMake.createPdf(dd).download(filename);
        if (typeof toast === 'function') toast(getLang() === 'ar' ? `تم تصدير تقرير ${customerName}` : `Report exported for ${customerName}`, 'success');
    };

    // ─── Helper builders ───────────────────────────────────────────────────────
    function kpiCard(label, value, color) {
        return {
            stack: [
                { text: label, fontSize: 7, color: '#64748b', bold: true, margin: [0, 0, 0, 4] },
                { text: value, fontSize: 13, bold: true, color: color },
            ],
            fillColor: '#0f172a',
            border: [false, false, false, false],
            margin: [10, 10, 10, 10],
            style: 'kpiCard'
        };
    }

    function summaryCell(label, value) {
        return {
            stack: [
                { text: label, fontSize: 7.5, color: '#64748b' },
                { text: value, fontSize: 10, bold: true, color: '#f1f5f9', margin: [0, 2, 0, 0] }
            ],
            fillColor: '#0f172a',
            border: [false, false, false, false],
            margin: [8, 8, 8, 8]
        };
    }

    // ─── Inject "Print Report" button into Targets page ────────────────────────
    function injectPrintButtonsTargets() {
        let rows = document.querySelectorAll('#ttb tr');
        rows.forEach(tr => {
            if (tr.querySelector('.sp-pdf-btn')) return;
            let editBtn = tr.querySelector('button');
            if (!editBtn) return;
            let customerName = '';
            let firstTd = tr.querySelector('td:first-child');
            if (firstTd) customerName = firstTd.childNodes[0]?.textContent?.trim() || '';
            if (!customerName) return;

            let btn = document.createElement('button');
            btn.className = 'btn sp-pdf-btn';
            btn.style.cssText = 'padding:4px 8px;font-size:0.75rem;background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.3);border-radius:6px;cursor:pointer;margin-top:4px;font-family:inherit;';
            btn.innerHTML = '📄 PDF';
            btn.title = getLang() === 'ar' ? 'تصدير تقرير PDF للعميل' : 'Export Customer PDF Report';
            btn.onclick = (e) => { e.stopPropagation(); window.generateCustomerReport(customerName); };

            let actTd = tr.querySelector('td:last-child');
            if (actTd) actTd.appendChild(btn);
        });
    }

    // ─── Hook into render cycle ────────────────────────────────────────────────
    let origRenderCR = window.render;
    window.render = function () {
        if (origRenderCR) origRenderCR();
        if (typeof P !== 'undefined' && P === 'targets') {
            setTimeout(injectPrintButtonsTargets, 500);
        }
    };

    // Also hook rTgt override
    let origRTgtCR = window.rTgt;
    window.rTgt = function () {
        if (origRTgtCR) origRTgtCR();
        setTimeout(injectPrintButtonsTargets, 600);
    };

    // ─── Global shortcut for customer profile modal ───────────────────────────
    // Extend customer profile if it exists
    let origCustProfile = window.openCustomerProfile;
    window.openCustomerProfile = function (name) {
        if (origCustProfile) origCustProfile(name);
        // Try to add PDF button to the profile modal
        setTimeout(() => {
            let modal = document.querySelector('.sp-modal-content, .customer-profile-modal');
            if (modal && !modal.querySelector('.sp-pdf-btn-profile')) {
                let pdfBtn = document.createElement('button');
                pdfBtn.className = 'sp-pdf-btn-profile';
                pdfBtn.style.cssText = `
                    width: 100%; margin-top: 12px; padding: 10px;
                    background: linear-gradient(135deg, #ef4444, #dc2626);
                    color: white; border: none; border-radius: 8px;
                    font-weight: bold; cursor: pointer; font-size: 0.9rem;
                    font-family: inherit; display: flex; align-items: center;
                    justify-content: center; gap: 8px;
                `;
                pdfBtn.innerHTML = `📄 ${getLang() === 'ar' ? 'تصدير تقرير PDF كامل' : 'Export Full PDF Report'}`;
                pdfBtn.onclick = () => window.generateCustomerReport(name);
                modal.appendChild(pdfBtn);
            }
        }, 300);
    };

    // ─── Quick access: add "Export PDF" in Customers table ───────────────────
    function injectCustomerTablePDF() {
        let rows = document.querySelectorAll('#cTbody tr, #custTbody tr');
        rows.forEach(tr => {
            if (tr.querySelector('.sp-pdf-cust')) return;
            let firstTd = tr.querySelector('td:first-child');
            if (!firstTd) return;
            let customerName = firstTd.textContent.trim();
            if (!customerName || customerName.length < 2) return;

            let btn = document.createElement('button');
            btn.className = 'sp-pdf-cust';
            btn.style.cssText = 'background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#ef4444;border-radius:5px;padding:3px 7px;font-size:0.7rem;cursor:pointer;font-family:inherit;margin-right:4px;';
            btn.textContent = '📄';
            btn.title = getLang() === 'ar' ? 'تقرير PDF' : 'PDF Report';
            btn.onclick = (e) => { e.stopPropagation(); window.generateCustomerReport(customerName); };
            firstTd.appendChild(btn);
        });
    }

    let origRCust = window.rCust;
    if (origRCust) {
        window.rCust = function () {
            origRCust();
            setTimeout(injectCustomerTablePDF, 500);
        };
    }

    // Also inject when render is called on customers page
    let origRenderFinal = window.render;
    window.render = function () {
        if (origRenderFinal) origRenderFinal();
        if (typeof P !== 'undefined' && P === 'customers') {
            setTimeout(injectCustomerTablePDF, 600);
        }
    };

})();

</script>
<script>
  window.addEventListener('load', function() {
    try {
      if(typeof init === 'function') init();
    } catch(e) {
      alert('Error during init: ' + e.message + '\n' + e.stack);
    }
    setTimeout(function() {
      var loader = document.getElementById('LOADER');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() { loader.style.display = 'none'; }, 500);
      }
    }, 800);
  });
</script>

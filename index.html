// 3. Excel Import Helper
window.importFromExcel = function(targetType) {
    let input = document.createElement('input');
    input.type = 'file';
    input.accept = '.xlsx, .xls, .csv';
    input.onchange = function(e) {
        let file = e.target.files[0];
        if(!file) return;
        if(typeof XLSX === 'undefined') {
            alert('XLSX library not loaded yet!');
            return;
        }
        let reader = new FileReader();
        reader.onload = function(evt) {
            try {
                let data = new Uint8Array(evt.target.result);
                let workbook = XLSX.read(data, {type: 'array'});
                let firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                let jsonData = XLSX.utils.sheet_to_json(firstSheet);
                if(!jsonData || jsonData.length === 0) {
                    if(typeof toast==='function') toast(L==='ar'?'الملف فارغ أو غير صالح':'Empty file', 'error');
                    return;
                }
                if(targetType === 'leads' || targetType === 'prospects') {
                    let ld = []; try { ld = JSON.parse(localStorage.getItem('leadsData') || '[]'); } catch(err){}
                    jsonData.forEach(row => {
                        ld.push({
                            id: Date.now() + Math.random(),
                            name: row['Customer Name'] || row['Name'] || row['الاسم'] || row['اسم العميل'] || 'عميل مستورد',
                            phone: row['Phone'] || row['Mobile'] || row['رقم الهاتف'] || row['التليفون'] || '',
                            branch: row['Branch'] || row['الفرع'] || 'حدائق القبة',
                            status: row['Status'] || row['الحالة'] || 'Warm',
                            note: row['Note'] || row['ملاحظات'] || 'تم الاستيراد من الإكسل'
                        });
                    });
                    localStorage.setItem('leadsData', JSON.stringify(ld));
                    if(typeof toast==='function') toast(L==='ar'? 'تم استيراد ' + jsonData.length + ' عميل محتمل بنجاح!' : 'Imported ' + jsonData.length + ' leads!', 'success');
                    if(typeof render==='function') render();
                } else if(targetType === 'customers' || targetType === 'sales') {
                    let count = 0;
                    jsonData.forEach(row => {
                        let cName = row['Customer Name'] || row['Customer'] || row['اسم العميل'] || row['العميل'];
                        if(cName && !window.C.find(c => (c.name||'').toLowerCase() === cName.toLowerCase())) {
                            window.C.push({
                                id: Date.now() + Math.random(),
                                name: cName,
                                phone: row['Phone'] || row['Mobile'] || row['رقم الهاتف'] || '',
                                branch: row['Branch'] || row['الفرع'] || 'حدائق القبة',
                                type: row['Type'] || row['النوع'] || 'تجزئة'
                            });
                            count++;
                        }
                    });
                    sv('custData', window.C);
                    if(typeof toast==='function') toast(L==='ar'? 'تمت إضافة ' + count + ' عميل جديد بنجاح!' : 'Added ' + count + ' customers!', 'success');
                    if(typeof render==='function') render();
                } else {
                    if(typeof toast==='function') toast(L==='ar'?'تم تحليل الملف بنجاح':'File parsed successfully', 'success');
                }
            } catch(err) {
                if(typeof toast==='function') toast(L==='ar'?'حدث خطأ في قراءة ملف الإكسل':'Error reading excel', 'error');
            }
        };
        reader.readAsArrayBuffer(file);
    };
    input.click();
};

// 4. Global Search Helper
window.initGlobalSearch = function() {
    let input = document.getElementById('globalSearchInput');
    let resBox = document.getElementById('globalSearchResults');
    let clearBtn = document.getElementById('clearGlobalSearch');
    if(!input || !resBox) return;

    input.oninput = function() {
        let q = this.value.trim().toLowerCase();
        if(!q) {
            resBox.style.display = 'none';
            if(clearBtn) clearBtn.style.display = 'none';
            return;
        }
        if(clearBtn) clearBtn.style.display = 'inline';

        let matches = [];
        (window.S || []).forEach(s => {
            let c = (s.Customer || '').toLowerCase();
            let i = (s['Item Description'] || '').toLowerCase();
            if(c.includes(q) || i.includes(q)) {
                matches.push({ title: s.Customer || 'عميل', sub: s['Item Description'] || '', type: 'مبيعات', p: 'sales' });
            }
        });
        (window.C || []).forEach(c => {
            let n = (c.name || '').toLowerCase();
            let ph = (c.phone || '').toLowerCase();
            if(n.includes(q) || ph.includes(q)) {
                matches.push({ title: c.name || 'عميل', sub: c.phone || '', type: 'عميل', p: 'customers' });
            }
        });

        if(matches.length === 0) {
            resBox.innerHTML = '<div style="padding:12px;text-align:center;color:var(--tx2);">' + (L === 'ar' ? 'لا توجد نتائج مطابقة' : 'No results found') + '</div>';
        } else {
            let h = '';
            matches.slice(0, 8).forEach(m => {
                h += '<div onclick="P=\'' + m.p + '\';if(typeof buildNav===\'function\')buildNav();if(typeof render===\'function\')render();document.getElementById(\'globalSearchResults\').style.display=\'none\';document.getElementById(\'globalSearchInput\').value=\'\';" style="padding:10px 14px;border-bottom:1px solid var(--bd);cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background 0.2s;">' +
                    '<div><strong style="font-size:0.95rem;display:block;color:var(--tx1);">' + m.title + '</strong><span style="font-size:0.8rem;color:var(--tx2);">' + m.sub + '</span></div>' +
                    '<span class="badge" style="font-size:0.75rem;padding:4px 8px;background:var(--acl);color:var(--ac);border-radius:6px;">' + m.type + '</span>' +
                    '</div>';
            });
            resBox.innerHTML = h;
        }
        resBox.style.display = 'block';
    };

    if(clearBtn) {
        clearBtn.onclick = function() {
            input.value = '';
            resBox.style.display = 'none';
            this.style.display = 'none';
        };
    }
};

window.generateDailyReportData = function() {
    try {
        let sList = typeof window.S !== 'undefined' ? window.S : (typeof ld === 'function' ? ld('salesData') || [] : []);
        let cList = typeof window.C !== 'undefined' ? window.C : (typeof ld === 'function' ? ld('payData') || [] : []);
        let tList = typeof window.T !== 'undefined' ? window.T : (typeof ld === 'function' ? ld('targetData') || [] : []);
        
        let allDates = [];
        sList.forEach(r => {
            let d = typeof pd === 'function' ? pd(r['Order Date'] || r['Invoice Date']) : null;
            if (d && d.length === 10) allDates.push(d);
        });
        cList.forEach(r => {
            let d = typeof pd === 'function' ? pd(r['Date'] || r['Payment Date'] || r['Collection Date'] || r['Order Date']) : null;
            if (d && d.length === 10) allDates.push(d);
        });
        allDates.sort();
        
        let todayStr = new Date().toISOString().slice(0, 10);
        let latestDateStr = allDates.length > 0 ? allDates[allDates.length - 1] : todayStr;
        
        let totSales = 0, totProfit = 0, totTarget = 0, totColl = 0, accColl = 0, hwColl = 0;
        let custMap = {}, itemMap = {};
        
        sList.forEach(r => {
            let sv = typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales After Discount'] || r['Amount'] || 0);
            let pv = typeof getProfitVal === 'function' ? getProfitVal(r) : Number(r['Profit'] || 0);
            totSales += sv;
            totProfit += pv;
            
            let c = r.Customer || r['Customer Name'] || 'عميل غير محدد';
            if (!custMap[c]) custMap[c] = 0;
            custMap[c] += sv;
            
            let itm = r['Item Description'] || 'صنف غير محدد';
            if (!itemMap[itm]) itemMap[itm] = 0;
            itemMap[itm] += sv;
        });
        
        tList.forEach(r => { totTarget += Number(r.Target) || 0; });
        
        cList.forEach(r => {
            let cv = typeof getPayVal === 'function' ? getPayVal(r) : Number(r['Amount'] || r['Collection'] || 0);
            totColl += cv;
            let ref = (r['Payment Ref.'] || r['Payment Ref'] || '').toString().trim().toLowerCase();
            let cat = r['Item Class Name'] || r['Category'] || '';
            if (ref.startsWith('acc') || (typeof isAcc === 'function' && isAcc(cat))) accColl += cv;
            else hwColl += cv;
        });
        
        let marginPct = totSales > 0 ? (totProfit / totSales * 100) : 0;
        let achPct = totTarget > 0 ? (totSales / totTarget * 100) : 0;
        
        // Activity for latest recorded date
        let daySales = 0, dayProfit = 0, dayActiveCusts = {};
        sList.forEach(r => {
            let d = typeof pd === 'function' ? pd(r['Order Date'] || r['Invoice Date']) : null;
            if (d === latestDateStr) {
                daySales += (typeof getSalesVal === 'function' ? getSalesVal(r) : 0);
                dayProfit += (typeof getProfitVal === 'function' ? getProfitVal(r) : 0);
                if (r.Customer) dayActiveCusts[r.Customer] = 1;
            }
        });
        let dayColl = 0;
        cList.forEach(r => {
            let d = typeof pd === 'function' ? pd(r['Date'] || r['Payment Date'] || r['Collection Date'] || r['Order Date']) : null;
            if (d === latestDateStr) {
                dayColl += (typeof getPayVal === 'function' ? getPayVal(r) : Number(r['Amount'] || 0));
                if (r['Customer Name'] || r['Customer']) dayActiveCusts[r['Customer Name'] || r['Customer']] = 1;
            }
        });
        
        let topCusts = Object.entries(custMap).sort((a,b) => b[1] - a[1]).slice(0, 5);
        let topCustsText = topCusts.map((c, i) => `${i+1}. ${c[0]} (${typeof fmt==='function'?fmt(c[1]):c[1]} ج.م)`).join(' | ') || 'لا يوجد';
        
        let topItems = Object.entries(itemMap).sort((a,b) => b[1] - a[1]).slice(0, 5);
        let topItemsText = topItems.map((it, i) => `${i+1}. ${it[0]} (${typeof fmt==='function'?fmt(it[1]):it[1]} ج.م)`).join(' | ') || 'لا يوجد';
        
        let recentColls = cList.slice(0, 5).map(r => `${r['Customer Name']||r['Customer']||'عميل'}: ${typeof fmt==='function'?fmt(typeof getPayVal==='function'?getPayVal(r):r['Amount']||0):0} ج.م`).join(' | ') || 'لا يوجد';
        let totalCustomersCount = Object.keys(custMap).length;
        let dayActiveCustCount = Object.keys(dayActiveCusts).length;
        
        return {
            todayStr, latestDateStr, totSales, totProfit, totTarget, totColl, accColl, hwColl,
            marginPct, achPct, daySales, dayProfit, dayColl, dayActiveCustCount,
            totalCustomersCount, topCustsText, topItemsText, recentCollsText: recentColls,
            topCusts, topItems, recentCollsArr: cList.slice(0, 5)
        };
    } catch(e) {
        console.error('Error generating report data:', e);
        return {
            todayStr: new Date().toISOString().slice(0,10), latestDateStr: 'N/A',
            totSales: 0, totProfit: 0, totTarget: 0, totColl: 0, accColl: 0, hwColl: 0,
            marginPct: 0, achPct: 0, daySales: 0, dayProfit: 0, dayColl: 0, dayActiveCustCount: 0,
            totalCustomersCount: 0, topCustsText: 'لا يوجد', topItemsText: 'لا يوجد', recentCollsText: 'لا يوجد',
            topCusts: [], topItems: [], recentCollsArr: []
        };
    }
};

            let pkey = localStorage.getItem('sp_emailjs_public_key');

                if (!isAuto && typeof toast === 'function') toast(typeof L !== 'undefined' && L === 'ar' ? '❌ يرجى إدخال بيانات EmailJS في الإعدادات' : 'Please enter EmailJS credentials in Settings', 'error');
                return;
            }
            fetch('https://api.emailjs.com/api/v1.0/email/send', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    service_id: sid,
                    template_id: tid,
                    user_id: pkey,
                    template_params: {
                        to_email: repEmail,
                        subject: subject,
                        report_date: data.todayStr,
                        latest_date: data.latestDateStr,
                        total_sales: fFunc(data.totSales),
                        total_profit: fFunc(data.totProfit),
                        margin_pct: pFunc(data.marginPct),
                        target_achieved: pFunc(data.achPct),
                        total_collections: fFunc(data.totColl),
                        active_customers: data.dayActiveCustCount,
                        top_customers: data.topCustsText,
                        top_items: data.topItemsText,
                        message: `تقرير Sales Pro لليوم ${data.todayStr}: إجمالي المبيعات ${fFunc(data.totSales)} ج.م | إجمالي التحصيلات ${fFunc(data.totColl)} ج.م | تحقيق التارجت ${pFunc(data.achPct)}`
                    }
                })
            })
            .then(res => {
                if (!res.ok) throw new Error('EmailJS HTTP status ' + res.status);
                localStorage.setItem('sp_report_last_sent_date', data.todayStr);
                if (!isAuto) {
                    if (statusEl) statusEl.innerHTML = `<span style="color:var(--ok);">✅ تم إرسال التقرير بنجاح عبر EmailJS إلى ${repEmail}</span>`;
                    if (typeof toast === 'function') toast('✅ تم إرسال التقرير عبر EmailJS بنجاح', 'success');
                } else {
                    if (typeof toast === 'function') toast('📧 تم إرسال التقرير التلقائي عبر EmailJS', 'success');
                }
            })
            .catch(err => {
                console.error('[EmailJS Error]:', err);
                if (!isAuto && typeof toast === 'function') toast('❌ خطأ في إرسال EmailJS: ' + err.message, 'error');
            });
        } else if (service === 'webhook') {
            let wurl = localStorage.getItem('sp_webhook_url');
            if (!wurl) {
                if (!isAuto && typeof toast === 'function') toast('❌ يرجى إدخال رابط الويب هوك في الإعدادات', 'error');
                return;
            }
            fetch(wurl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: repEmail, reportData: data, timestamp: new Date().toISOString() })
            })
            .then(res => {
                localStorage.setItem('sp_report_last_sent_date', data.todayStr);
                if (!isAuto) {

                    if (typeof toast === 'function') toast('✅ تم إرسال التقرير عبر الويب هوك بنجاح', 'success');
                }
            })
            .catch(err => {
                console.error('[Webhook Error]:', err);
                if (!isAuto && typeof toast === 'function') toast('❌ خطأ في إرسال الويب هوك', 'error');
            });
        }
    } catch(err) {
        console.error('[sendDailyReportNow Exception]:', err);
    }

window.checkAndSendDailyReport = function() {
    try {
        let isAuto = localStorage.getItem('sp_report_auto') !== 'false';
        if (!isAuto) return;
        
        let repEmail = localStorage.getItem('sp_report_email') || (typeof currentUser !== 'undefined' && currentUser ? currentUser.email : '');
        if (!repEmail) return;
        
        let todayStr = new Date().toISOString().slice(0, 10);
        let lastSent = localStorage.getItem('sp_report_last_sent_date');
        
        if (lastSent === todayStr) {
            console.log('[Daily Report]: Already sent for today (' + todayStr + ')');
            return;
        }
        
        console.log('[Daily Report]: Automatic trigger checking in for today (' + todayStr + ')...');
        // Small check to avoid sending if sales list is empty or still initializing
        let sList = typeof window.S !== 'undefined' ? window.S : [];
        let cList = typeof window.C !== 'undefined' ? window.C : [];
        if (sList.length === 0 && cList.length === 0) {
            console.log('[Daily Report]: Waiting for data before sending...');
            return;
        }
        
        window.sendDailyReportNow(true);
    } catch(err) {
        console.error('[checkAndSendDailyReport Error]:', err);
    }
};

window.addEventListener('load', () => {
    setTimeout(() => {
        if (typeof checkAndSendDailyReport === 'function') {

        }

});

<script>
// js/gdrive.js - Full Google Drive API Integration

const DISCOVERY_DOC = 'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest';
const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.appdata';

let tokenClient;
let gapiInited = false;
let gisInited = false;

window.gapiLoaded = function() {
    if (typeof gapi !== 'undefined' && !gapi.client) {
        gapi.load('client', initializeGapiClient);
    } else if (typeof gapi !== 'undefined' && gapi.client) {
        initializeGapiClient();
    }
};

async function initializeGapiClient() {
    try {
        const API_KEY = localStorage.getItem('gdrive_api_key');
        if (!API_KEY) return;
        
        // Ensure gapi.client is loaded
        if (typeof gapi !== 'undefined' && !gapi.client) {
            await new Promise((resolve) => gapi.load('client', resolve));
        }

        await gapi.client.init({
            apiKey: API_KEY,
            discoveryDocs: [DISCOVERY_DOC],
        });
        gapiInited = true;
    } catch (err) {
        console.warn("Error initializing GAPI client: ", err);
        throw err;
    }
}

window.gisLoaded = function() {
    const CLIENT_ID = localStorage.getItem('gdrive_client_id');
    if (!CLIENT_ID) return;
    if (typeof google === 'undefined' || !google.accounts) return;
    
    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: '', 
    });
    gisInited = true;
};

// Auto-run if script tags loaded before this script
if (typeof gapi !== 'undefined') window.gapiLoaded();
if (typeof google !== 'undefined') window.gisLoaded();

let isInitializing = false;

async function requireAuth(callback) {
    const CLIENT_ID = localStorage.getItem('gdrive_client_id');
    const API_KEY = localStorage.getItem('gdrive_api_key');
    
    if (!CLIENT_ID || !API_KEY) {
        if(typeof toast === 'function') toast(L==='ar'?'يجب إدخال Google Client ID و API Key في الإعدادات':'Please enter Google Client ID and API Key in Settings', 'error');
        return;
    }

    if (isInitializing) {
        setTimeout(() => requireAuth(callback), 500);
        return;
    }

    isInitializing = true;
    try {
        if (!gapiInited) await initializeGapiClient();
        if (!gisInited) window.gisLoaded();
    } catch(e) {
        console.error(e);
    }
    isInitializing = false;

    if (!gapiInited || !gisInited) {
        if(typeof toast === 'function') toast(L==='ar'?'فشل الاتصال بخوادم جوجل. تأكد من صحة المفاتيح.':'Failed to connect to Google. Check keys.', 'error');
        return;
    }

    tokenClient.callback = async (resp) => {
        if (resp.error !== undefined) {
            if(typeof toast === 'function') toast(L==='ar'?'خطأ في تسجيل الدخول لجوجل':'Google Login Error', 'error');
            console.error(resp);
            return;
        }
        callback();
    };

    if (gapi.client.getToken() === null) {
        tokenClient.requestAccessToken({prompt: 'consent'});
    } else {
        tokenClient.requestAccessToken({prompt: ''});
    }
}

window.backupToGoogleDrive = function() {
    requireAuth(async () => {
        if(typeof toast === 'function') toast(L==='ar'?'جاري الحفظ في جوجل درايف...':'Saving to Google Drive...', 'info');
        
        let ds = document.getElementById('driveStatus');
        if(ds) ds.innerHTML = `<span style="color:blue">${L==='ar'?'جاري الرفع...':'Uploading...'}</span>`;

        let dump = {
            salesData:  S        || [],
            targetData: T        || [],
            accCats:    accCats  || [],
            hwCats:     hwCats   || [],
            payData:    C        || [],
            duesData:   D        || [],
            lastUpdated: new Date().toISOString()
        };
        const fileContent = JSON.stringify(dump);
        const file = new Blob([fileContent], { type: 'application/json' });
        const metadata = {
            'name': `SalesPro_Backup.json`,
            'mimeType': 'application/json'
        };

        const form = new FormData();
        form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
        form.append('file', file);

        try {
            // First check if file already exists to overwrite it
            let existingFileId = null;
            const search = await gapi.client.drive.files.list({
                q: "name='SalesPro_Backup.json' and trashed=false",
                spaces: 'drive',
                fields: 'files(id, name)'
            });
            if (search.result.files && search.result.files.length > 0) {
                existingFileId = search.result.files[0].id;
            }

            let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
            let method = 'POST';
            if (existingFileId) {
                url = `https://www.googleapis.com/upload/drive/v3/files/${existingFileId}?uploadType=multipart`;
                method = 'PATCH';
            }

            const res = await fetch(url, {
                method: method,
                headers: new Headers({ 'Authorization': 'Bearer ' + gapi.client.getToken().access_token }),
                body: form
            });
            
            const data = await res.json();
            if (data.id) {
                let tme = new Date().toLocaleString(L === 'ar' ? 'ar-EG' : 'en-US');
                localStorage.setItem('last_gdrive_sync', tme);
                if(typeof toast === 'function') toast(L==='ar'?'✅ تم الحفظ في جوجل درايف!':'✅ Saved to Google Drive!', 'success');
                if(ds) ds.innerHTML = `✅ <strong>${L==='ar'?'آخر مزامنة:':'Last sync:'}</strong> ${tme}`;
            } else {
                throw new Error("Invalid response from Google Drive");
            }
        } catch (err) {
            console.error("Upload error", err);
            if(ds) ds.innerHTML = `<span style="color:red">Upload Error</span>`;
            if(typeof toast === 'function') toast(L==='ar'?'❌ فشل الحفظ في السحابة':'❌ Cloud save failed', 'error');
        }
    });
};

window.restoreFromGoogleDrive = function() {
    if (!confirm(L === 'ar' ? 'تحذير: سيتم استبدال البيانات الحالية بالنسخة الموجودة في جوجل درايف. متأكد؟' : 'Warning: Current data will be replaced with Google Drive backup. Sure?')) return;
    
    requireAuth(async () => {
        if(typeof toast === 'function') toast(L==='ar'?'جاري البحث عن النسخة...':'Searching for backup...', 'info');
        let ds = document.getElementById('driveStatus');
        if(ds) ds.innerHTML = `<span style="color:blue">${L==='ar'?'جاري التنزيل...':'Downloading...'}</span>`;

        try {
            const search = await gapi.client.drive.files.list({
                q: "name='SalesPro_Backup.json' and trashed=false",
                spaces: 'drive',
                fields: 'files(id, name, modifiedTime)',
                orderBy: 'modifiedTime desc'
            });

            if (!search.result.files || search.result.files.length === 0) {
                if(typeof toast === 'function') toast(L==='ar'?'❌ لا يوجد نسخة احتياطية في جوجل درايف!':'❌ No backup found in Google Drive!', 'error');
                if(ds) ds.innerHTML = `<span style="color:red">No backup found!</span>`;
                return;
            }

            const fileId = search.result.files[0].id;
            
            // Download file content
            const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
                headers: new Headers({ 'Authorization': 'Bearer ' + gapi.client.getToken().access_token })
            });
            
            const content = await res.text();
            let p = JSON.parse(content);
            
            if (p.salesData)  { S       = p.salesData;  sv('salesData',  S); }
            if (p.targetData) { T       = p.targetData; sv('targetData', T); }
            if (p.accCats)    { accCats = p.accCats;    sv('accCats',    accCats); }
            if (p.hwCats)     { hwCats  = p.hwCats;     sv('hwCats',     hwCats); }
            if (p.payData)    { C       = p.payData;    sv('payData',    C); }
            if (p.duesData)   { D       = p.duesData;   sv('duesData',   D); }

            let tme = new Date(search.result.files[0].modifiedTime).toLocaleString(L === 'ar' ? 'ar-EG' : 'en-US');
            localStorage.setItem('last_gdrive_sync', tme);

            if (typeof toast === 'function') toast(L === 'ar' ? '✅ تم الاسترجاع بنجاح!' : '✅ Restored successfully!', 'success');
            if(ds) ds.innerHTML = `✅ <strong>${L==='ar'?'تم الاسترجاع!':'Restored!'}</strong>`;
            
            setTimeout(() => window.location.reload(), 1500);

        } catch (err) {
            console.error("Restore error", err);
            if(ds) ds.innerHTML = `<span style="color:red">Restore Error</span>`;
            if(typeof toast === 'function') toast(L==='ar'?'❌ فشل استرجاع البيانات':'❌ Restore failed', 'error');
        }
    });
};

window.saveToFirebaseCloud = async function() {
    if (typeof currentUser === 'undefined' || !currentUser || typeof db === 'undefined' || !db) return;
    try {
        let dump = {
            salesData:  typeof S !== 'undefined' ? (S || []) : [],
            targetData: typeof T !== 'undefined' ? (T || []) : [],
            accCats:    typeof accCats !== 'undefined' ? (accCats || []) : [],
            hwCats:     typeof hwCats !== 'undefined' ? (hwCats || []) : [],
            payData:    typeof C !== 'undefined' ? (C || []) : [],
            duesData:   typeof D !== 'undefined' ? (D || []) : [],
            lastUpdated: new Date().toISOString(),
            savedBy: currentUser.email || currentUser.uid
        };
        
        let str = JSON.stringify(dump);
        const chunkSize = 800000;
        let numChunks = Math.ceil(str.length / chunkSize);
        
        await db.collection('users').doc(currentUser.uid).set({
            backup_chunks: numChunks,
            backup_timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            backup_lastUpdated: dump.lastUpdated,
            backup_savedBy: dump.savedBy
        }, { merge: true });
        
        for(let i=0; i<numChunks; i++){
            let part = str.slice(i*chunkSize, (i+1)*chunkSize);
            await db.collection('users').doc(currentUser.uid).collection('chunks').doc('backup_chunk_'+i).set({ data: part });
        }
        console.log("✅ Silent Firebase cloud backup complete!");
    } catch(e) {
        console.error("Firebase backup error:", e);
    }
};

window.cloudAutoSave = function() {
    if (typeof window.saveToFirebaseCloud === 'function') {
        window.saveToFirebaseCloud();

    if (typeof window.backupToGoogleDrive === 'function') {
        if (window.gapi && gapi.client && gapi.client.getToken() !== null) {
            window.backupToGoogleDrive();
        }
    }
};

// Automatic backup to Google Drive every 15 minutes (900,000 ms)
setInterval(() => {
    console.log("🕒 Running 15-minute automatic backup to Google Drive...");
    if (typeof window.backupToGoogleDrive === 'function') {

}, 15 * 60 * 1000);

    };
};

window.captureGPSCoords = function() {
    let L = (typeof localStorage !== 'undefined' && localStorage.getItem('sp_lang')) || 'ar';
    let st = document.getElementById('gpsStatusText');
    if (!navigator.geolocation) {
        if(st) st.innerHTML = `⚠️ ${L==='ar'?'المتصفح لا يدعم الـ GPS':'Geolocation not supported'}`;
        return;
    }
    if(st) st.innerHTML = `⏳ ${L==='ar'?'جاري تحديد الموقع بدقة...':'Acquiring GPS position...'}`;
    navigator.geolocation.getCurrentPosition(
        function(pos) {
            let lat = pos.coords.latitude.toFixed(6);
            let lng = pos.coords.longitude.toFixed(6);
            let acc = Math.round(pos.coords.accuracy);
            let latEl = document.getElementById('nvGpsLat');
            let lngEl = document.getElementById('nvGpsLng');
            if(latEl) latEl.value = lat;
            if(lngEl) lngEl.value = lng;
            if(st) st.innerHTML = `🟢 <b>${lat}, ${lng}</b> <small>(±${acc}m)</small>`;
        },
        function(err) {
            if(st) st.innerHTML = `⚠️ ${L==='ar'?'تعذر تحديد الموقع: يرجى تفعيل الـ GPS':'GPS Error: Please enable location'}`;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
};

window.calcLiveScore = function() {
    let score = 0;
    if (document.getElementById('chkMaint') && document.getElementById('chkMaint').checked) score += 10;
    if (document.getElementById('chkStar') && document.getElementById('chkStar').checked) score += 5;
    if (document.getElementById('chkTgt') && document.getElementById('chkTgt').checked) score += 5;
    if (document.getElementById('chkStock') && document.getElementById('chkStock').checked) score += 10;
    if (document.getElementById('chkColl') && document.getElementById('chkColl').checked) score += 20;
    if (document.getElementById('chkSale') && document.getElementById('chkSale').checked) score += 50;

    let b = document.getElementById('liveScoreBadge');
    if (b) {
        b.textContent = score + '%';
        b.className = 'score-pill ' + (score >= 80 ? 'score-pill-green' : (score >= 50 ? 'score-pill-yellow' : 'score-pill-red'));
    }
    return score;
};

window.saveVisit = function() {
    let L = (typeof localStorage !== 'undefined' && localStorage.getItem('sp_lang')) || 'ar';
    let c = document.getElementById('nvCust') ? document.getElementById('nvCust').value : '';
    let d = document.getElementById('nvDate') ? document.getElementById('nvDate').value : '';
    let o = document.getElementById('nvOutcome') ? document.getElementById('nvOutcome').value : '';
    let n = document.getElementById('nvNext') ? document.getElementById('nvNext').value : '';
    let area = document.getElementById('nvArea') ? document.getElementById('nvArea').value : '';
    let purp = document.getElementById('nvPurpose') ? document.getElementById('nvPurpose').value : '';
    let tier = document.getElementById('nvTier') ? document.getElementById('nvTier').value : '';
    let sVal = document.getElementById('nvSaleVal') ? Number(document.getElementById('nvSaleVal').value) || 0 : 0;
    let cVal = document.getElementById('nvCollVal') ? Number(document.getElementById('nvCollVal').value) || 0 : 0;
    let contact = document.getElementById('nvContact') ? document.getElementById('nvContact').value : '';
    let lat = document.getElementById('nvGpsLat') ? document.getElementById('nvGpsLat').value : '';
    let lng = document.getElementById('nvGpsLng') ? document.getElementById('nvGpsLng').value : '';
    let score = calcLiveScore();

    if(!c || !d) { 
        alert(L==='ar'?'العميل والتاريخ مطلوبان':'Customer and date are required'); 
        return; 
    }

    let visitsData = JSON.parse(localStorage.getItem('sp_visits') || '[]');
    let now = new Date();
    let timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    visitsData.push({
        id: Date.now(),
        customer: c,
        date: d,
        time: timeStr,
        area: area,
        purpose: purp,
        tier: tier,
        score: score,
        salesAmount: sVal,
        collAmount: cVal,
        contact: contact,
        outcome: o,
        nextDate: n,
        gpsLat: lat,
        gpsLng: lng,
        timestamp: Date.now()
    });

    localStorage.setItem('sp_visits', JSON.stringify(visitsData));
    let modal = document.getElementById('vModal');
    if(modal) modal.remove();
    loadVisits();
    if(typeof toast === 'function') toast(L==='ar'?'تم توثيق وحفظ الزيارة بنجاح 🚗':'Visit logged & verified successfully 🚗', 'success');
};

window.deleteVisit = function(id) {
    let L = (typeof localStorage !== 'undefined' && localStorage.getItem('sp_lang')) || 'ar';
    if (!confirm(L==='ar'?'هل أنت متأكد من حذف هذه الزيارة؟':'Are you sure you want to delete this visit?')) return;
    let visitsData = JSON.parse(localStorage.getItem('sp_visits') || '[]');
    visitsData = visitsData.filter(v => v.id !== id);
    localStorage.setItem('sp_visits', JSON.stringify(visitsData));
    loadVisits();
    if(typeof toast === 'function') toast(L==='ar'?'تم الحذف':'Deleted', 'info');
};

window.sendVisitWhatsApp = function(encodedVisit) {
    let L = (typeof localStorage !== 'undefined' && localStorage.getItem('sp_lang')) || 'ar';
    try {
        let v = JSON.parse(decodeURIComponent(encodedVisit));
        let phone = (v.contact || '').replace(/[^0-9]/g, '');
        let msg = L==='ar' 
            ? `مرحباً بك ${v.customer} 🌸%0Aسعدنا بزيارتكم اليوم ${v.date}.%0A` +
              (v.nextDate ? `موعد متابعتنا القادم: ${v.nextDate}%0A` : '') +
              `شكراً لتعاملكم معنا - Sales Pro Enterprise`
            : `Hello ${v.customer},%0AThank you for meeting us today (${v.date}).%0A` +
              (v.nextDate ? `Our next scheduled follow-up: ${v.nextDate}%0A` : '') +
              `Best regards, Sales Pro Enterprise`;
        let url = phone ? `https://wa.me/${phone}?text=${msg}` : `https://wa.me/?text=${msg}`;
        window.open(url, '_blank');
    } catch(e) {
        alert(e.message);
    }
};

window.exportVisitsToExcel = function() {
    if (typeof XLSX === 'undefined') {
        alert('Excel library not loaded.');
        return;
    }
    let visitsData = JSON.parse(localStorage.getItem('sp_visits') || '[]');
    if (visitsData.length === 0) {
        alert('No visits data to export.');
        return;
    }
    let exportRows = visitsData.map(v => ({
        "Date": v.date,
        "Time": v.time || "",
        "Customer Name": v.customer,
        "Area / Territory": v.area || "",
        "Purpose": v.purpose || "",
        "Tier": v.tier || "",
        "Score %": v.score || 0,
        "Sales Value (EGP)": v.salesAmount || 0,
        "Collection Value (EGP)": v.collAmount || 0,
        "Contact / Mobile": v.contact || "",
        "Outcome / Notes": v.outcome || "",
        "Next Visit Date": v.nextDate || "",
        "GPS Lat": v.gpsLat || "",
        "GPS Lng": v.gpsLng || ""
    }));
    let ws = XLSX.utils.json_to_sheet(exportRows);
    let wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Field Visits");
    XLSX.writeFile(wb, `SalesPro_Field_Visits_${new Date().toISOString().split('T')[0]}.xlsx`);
};

window.addPosCartItem = function() {
    let sel = document.getElementById('posProdSelect');
    let qtyEl = document.getElementById('posQty');
    if (!sel || !qtyEl) return;
    let qty = Number(qtyEl.value) || 1;
    let stockData = [];
    try { stockData = JSON.parse(localStorage.getItem('sp_stock_v1') || '[]'); } catch(e) {}
    
    let item = stockData[sel.value] || { name: sel.options[sel.selectedIndex].text.split('(')[0].trim(), price: 150 };
    let price = Number(item.price || item.Price || 150);
    
    if(!window._posCart) window._posCart = [];
    window._posCart.push({ name: item.name || item.Item, price: price, qty: qty, total: price * qty });
    renderPosCart();
};

window.renderPosCart = function() {
    let L = (typeof localStorage !== 'undefined' && localStorage.getItem('sp_lang')) || 'ar';
    let tb = document.getElementById('posCartBody');
    let totEl = document.getElementById('posTotalVal');
    if (!tb) return;
    tb.innerHTML = '';
    let grandTotal = 0;
    
    if (!window._posCart || window._posCart.length === 0) {
        tb.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--tx3);">${L==='ar'?'السلة فارغة':'Cart is empty'}</td></tr>`;
        if (totEl) totEl.innerHTML = `0.00 <small style="font-size:0.8rem;">${L==='ar'?'ج.م':'EGP'}</small>`;
        return;
    }

    window._posCart.forEach((it, idx) => {
        grandTotal += it.total;
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td style="padding:10px;font-weight:600;color:var(--tx1);">${it.name}</td>
            <td style="padding:10px;text-align:center;">${it.price.toLocaleString()}</td>
            <td style="padding:10px;text-align:center;">
                <button type="button" class="pos-qty-btn" onclick="updatePosQty(${idx}, -1)">-</button>
                <span style="display:inline-block;width:30px;text-align:center;font-weight:bold;">${it.qty}</span>
                <button type="button" class="pos-qty-btn" onclick="updatePosQty(${idx}, 1)">+</button>
            </td>
            <td style="padding:10px;text-align:center;font-weight:bold;color:#10b981;">${it.total.toLocaleString()}</td>
            <td style="padding:10px;text-align:center;"><button type="button" onclick="removePosItem(${idx})" style="background:none;border:none;color:#ef4444;cursor:pointer;">🗑️</button></td>
        `;
        tb.appendChild(tr);
    });

    if (totEl) totEl.innerHTML = `${grandTotal.toLocaleString()} <small style="font-size:0.8rem;">${L==='ar'?'ج.م':'EGP'}</small>`;
};

window.updatePosQty = function(idx, delta) {
    if (!window._posCart || !window._posCart[idx]) return;
    window._posCart[idx].qty += delta;
    if (window._posCart[idx].qty <= 0) {
        window._posCart.splice(idx, 1);
    } else {
        window._posCart[idx].total = window._posCart[idx].qty * window._posCart[idx].price;
    }
    renderPosCart();
};

window.removePosItem = function(idx) {
    if (!window._posCart) return;
    window._posCart.splice(idx, 1);
    renderPosCart();
};

window.checkoutPosOrder = function(sendWhatsApp = false) {
    let L = (typeof localStorage !== 'undefined' && localStorage.getItem('sp_lang')) || 'ar';
    let cust = document.getElementById('posCust') ? document.getElementById('posCust').value : '';
    let phone = document.getElementById('posPhone') ? document.getElementById('posPhone').value.replace(/[^0-9]/g, '') : '';
    if (!cust || !window._posCart || window._posCart.length === 0) {
        alert(L==='ar'?'يرجى اختيار العميل وإضافة صنف واحد على الأقل':'Please select a customer and at least 1 item');
        return;
    }

    let grandTotal = window._posCart.reduce((sum, it) => sum + it.total, 0);
    let invNum = 'INV-' + Math.floor(100000 + Math.random() * 900000);
    let dateStr = new Date().toISOString().split('T')[0];

    // Save to Orders storage
    let orders = JSON.parse(localStorage.getItem('sp_orders') || '[]');
    orders.push({
        id: Date.now(),
        invNum: invNum,
        customer: cust,
        phone: phone,
        date: dateStr,
        items: [...window._posCart],
        total: grandTotal
    });
    localStorage.setItem('sp_orders', JSON.stringify(orders));

    if (sendWhatsApp) {
        let itemsList = window._posCart.map(it => `• ${it.name} (×${it.qty}) = ${it.total.toLocaleString()} EGP`).join('%0A');
        let msg = L==='ar'
            ? `*فاتورة مبيعات رقم ${invNum}* 🧾%0A` +
              `العميل: *${cust}*%0A` +
              `التاريخ: ${dateStr}%0A` +
              `-----------------------%0A` +
              `${itemsList}%0A` +
              `-----------------------%0A` +
              `*الإجمالي الصافي: ${grandTotal.toLocaleString()} ج.م* 💰%0A%0A` +
              `شكراً لتعاملكم معنا - Sales Pro Enterprise`
            : `*Sales Invoice #${invNum}* 🧾%0A` +
              `Customer: *${cust}*%0A` +
              `Date: ${dateStr}%0A` +
              `-----------------------%0A` +
              `${itemsList}%0A` +
              `-----------------------%0A` +
              `*Net Total: ${grandTotal.toLocaleString()} EGP* 💰%0A%0A` +
              `Thank you for your business - Sales Pro Enterprise`;
        let url = phone ? `https://wa.me/${phone}?text=${msg}` : `https://wa.me/?text=${msg}`;
        window.open(url, '_blank');
    }

    let m = document.getElementById('posModal');
    if (m) m.remove();
    if(typeof toast === 'function') toast(L==='ar'?`تم حفظ الفاتورة ${invNum} بنجاح`:`Invoice ${invNum} saved successfully`, 'success');
};

window.handleTargetImport = function(e) {
    let L = (typeof localStorage !== 'undefined' && localStorage.getItem('sp_lang')) || 'ar';
    let file = e.target.files[0];
    if(!file) return;
    let reader = new FileReader();
    reader.onload = ev => {
        try {
            let wb = typeof XLSX !== 'undefined' ? XLSX.read(new Uint8Array(ev.target.result), {type:'array'}) : null;
            if(!wb) { alert('Excel library not found!'); return; }
            let ws = wb.Sheets[wb.SheetNames[0]];
            let d = XLSX.utils.sheet_to_json(ws);
            let norm = d.map(r => {
                let Customer = r.Customer || r['العميل'] || r['Customer Name'] || r['اسم العميل'] || r['الاسم'];
                let Target = r.Target || r['التارجت'] || r['Total Target'] || r['تارجت'] || 0;
                let phone = r.Phone || r['رقم الموبايل'] || r['موبايل'] || r['رقم الهاتف'] || r['Mobile'] || r.phone || '';
                let address = r.Address || r['العنوان'] || r['عنوان'] || r.address || '';
                let hwTarget = r['Target HW'] || r['تارجت هاردوير'] || r['Hardware Target'] || r.hwTarget || 0;
                let accTarget = r['Target Acc'] || r['تارجت اكسسوارات'] || r['Accessories Target'] || r['تارجت اكسسوار'] || r.accTarget || 0;
                if(!Target && (hwTarget || accTarget)) Target = Number(hwTarget||0) + Number(accTarget||0);
                return { ...r, Customer, Target: Number(Target)||0, phone, address, hwTarget: Number(hwTarget)||0, accTarget: Number(accTarget)||0 };
            }).filter(r => r.Customer);
            window.T = norm;
            if(typeof sv === 'function') sv('targetData', norm);
            alert(L==='ar'?'تم استيراد البيانات بنجاح!':'Data imported successfully!');
            if(typeof window.rTgt === 'function') window.rTgt();
            if(typeof window.cloudAutoSave === 'function') window.cloudAutoSave(L==='ar'?'استيراد تارجت من إكسيل':'Target imported from Excel');
        } catch(err) {
            alert('Error reading file');
        }
    };
    reader.readAsArrayBuffer(file);
};

    let tData = getT();
    
    let sMap = {}, accSMap = {}, hwSMap = {};
    let pMap = {}, accPMap = {}, hwPMap = {};
    
    if(sData && sData.length > 0) {
        sData.forEach(r => {
            let c = r.Customer || r['Customer Name'];
            if(!c) return;
            let s = typeof getSalesVal === 'function' ? getSalesVal(r) : 0;

            </div>
        </div>

window.checkDailyAlerts = function() {
    let lastCheck = localStorage.getItem('sp_last_alert_check');
    let today = new Date().toISOString().split('T')[0];
    
    let delayCount = 0;
    let T_data = (typeof getT === 'function') ? getT() : (T || []);
    let S_data = (typeof getS === 'function') ? getS() : (S || []);
    
    if (T_data.length > 0 && S_data.length > 0) {
        let cuS = {};
        S_data.forEach(r => { let c=r.Customer||''; cuS[c]=(cuS[c]||0)+(typeof getSalesVal === 'function' ? getSalesVal(r) : Number(r['Sales Without Tax']||0)); });
        T_data.forEach(r => {
            let tg=Number(r.Target)||0, ach=cuS[r.Customer]||0, pct=tg>0?ach/tg*100:0;
            if(pct < 50 && tg > 0) delayCount++;
        });
    }
    
    let mailSentToday = localStorage.getItem('sp_auto_mail_sent') === today;
    
    if (delayCount > 0 && lastCheck !== today) {
        let emailBody = encodeURIComponent(`تنبيه يومي: يوجد ${delayCount} عملاء متأخرين عن تحقيق 50% من المستهدف. يرجى المتابعة العاجلة.`);
        let emailAddress = localStorage.getItem('repEmailInput') || '';
        let mailLink = `mailto:${emailAddress}?subject=تنبيه تأخير تارجت العملاء&body=${emailBody}`;
        
        if(!mailSentToday) {
            localStorage.setItem('sp_auto_mail_sent', today);
            if(typeof window.checkAndSendDailyReport === 'function') {
                window.checkAndSendDailyReport();
            } else {
                window.open(mailLink, '_blank');
            }
        }
    }
    localStorage.setItem('sp_last_alert_check', today);
};

                    hT += Number(t.hwTarget||0);
                    aT += Number(t.accTarget||0);
                });
                
                // Fallback to total target logic if explicit hw/acc missing

window.saveLeadFollowUp = function(name, dateStr) {
    let leads = JSON.parse(localStorage.getItem('leadsData') || '[]');
    let idx = leads.findIndex(l => l.name === name);
    if(idx > -1) {
        leads[idx].followUp = dateStr;
        localStorage.setItem('leadsData', JSON.stringify(leads));
        window.updateFollowUpBadge();
        if (typeof toast === 'function') toast(localStorage.getItem('sp_lang')==='ar'?'تم الحفظ':'Saved');
        
        // Update input style if due
        let d = new Date(dateStr);
        let today = new Date();
        today.setHours(0,0,0,0);
        let isDue = (d <= today);
        let input = document.querySelector(`input[onchange*="${name}"]`);
        if (input) {
            input.style.borderColor = isDue ? '#ef4444' : 'var(--bd)';
            input.style.color = isDue ? '#ef4444' : 'var(--tx1)';
            input.style.fontWeight = isDue ? 'bold' : 'normal';
        }
    }
};

window.updateFollowUpBadge = function() {
    let leads = JSON.parse(localStorage.getItem('leadsData') || '[]');
    let dueCount = 0;
    let today = new Date();
    today.setHours(0,0,0,0);
    
    leads.forEach(l => {
        if(l.followUp) {
            let d = new Date(l.followUp);
            if (d <= today && l.status !== 'Customer') dueCount++;
        }
    });
    
    let el = document.querySelector('.ni[data-p="prospects"]');
    if (!el) el = document.querySelector('.ni[data-p="leads"]');
    
    if (el) {
        let b = el.querySelector('.f-badge');
        if (dueCount > 0) {
            if(!b) {
                b = document.createElement('span');
                b.className = 'f-badge';
                b.style.cssText = 'background:#ef4444;color:white;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:bold;margin-left:auto;margin-right:auto;box-shadow:0 0 5px rgba(239,68,68,0.5);';
                el.appendChild(b);
            }
            b.textContent = dueCount;
        } else if (b) {
            if (typeof b.remove === 'function') b.remove();
            else if (b.parentNode) b.parentNode.removeChild(b);
        }
    }
};

                ${L==='ar'?'جاري تحميل الخريطة...':'Loading Map...'}

        </div>
    `;
    
    if (!window.L_map_loaded) {

        document.head.appendChild(link);
        
        let script = document.createElement('script');
        script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        script.onload = () => {
            let heatScript = document.createElement('script');
            heatScript.src = 'https://unpkg.com/leaflet.heat/dist/leaflet-heat.js';
            heatScript.onload = () => { window.L_map_loaded = true; window.renderMap(); };
            document.head.appendChild(heatScript);
        };
        document.head.appendChild(script);

    }

window.renderMap = function() {
    let container = document.getElementById('sp_map_container');
    if(!container) return;
    
    let loader = document.getElementById('map_loader');
    if(loader) loader.remove();
    
    // Clear and recreate map div to avoid Leaflet "map already initialized" error
    container.innerHTML = '<div id="real_map" style="width:100%;height:100%;"></div>';
    
    var map = L.map('real_map').setView([30.0131, 31.2089], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    
    let leads = JSON.parse(localStorage.getItem('leadsData') || '[]');
    let heatPoints = [];
    
    leads.forEach(l => {
        if(l.lat && l.lon) {
            let intensity = (l.status === 'Customer' || l.status === 'عميل') ? 1.0 : (l.status === 'Contacted' || l.status === 'تم التواصل' ? 0.7 : 0.4);
            heatPoints.push([l.lat, l.lon, intensity]);
            
            let color = (l.status === 'Customer' || l.status === 'عميل') ? '#10b981' : ((l.status === 'Contacted' || l.status === 'تم التواصل') ? '#3b82f6' : '#ef4444');
            L.circleMarker([l.lat, l.lon], {radius: 6, color: color, fillColor: color, fillOpacity: 0.8, weight: 1})
             .bindPopup(`<b style="color:#000;">${l.name}</b><br><span style="color:#555;">${l.status}</span><br>${l.phone||''}`)
             .addTo(map);
        }
    });
    
    if(heatPoints.length > 0 && typeof L.heatLayer === 'function') {
        L.heatLayer(heatPoints, {radius: 35, blur: 20, maxZoom: 17, gradient: {0.4: 'red', 0.7: 'blue', 1.0: 'lime'}}).addTo(map);
        
        // Fit bounds to points
        let bounds = L.latLngBounds(heatPoints.map(p => [p[0], p[1]]));
        map.fitBounds(bounds, {padding: [50, 50]});
    }
};

window.saveCustomerTarget = function(originalName) {

// --- PHASE 6: Firestore Realtime Sync & Offline Persistence ---
(function() {
    let fCheck = setInterval(() => {
        if (typeof firebase !== 'undefined' && typeof db !== 'undefined' && typeof currentUser !== 'undefined' && currentUser) {
            clearInterval(fCheck);
            initRealtimeSync();
        }
    }, 1000);

    let isSyncingFromServer = false;
    let localHashes = { sales: {}, targets: {}, customers: {}, leads: {} };
    
    // Simple hash function for diffing
    function hashObj(obj) {
        let str = JSON.stringify(obj);
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            let char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash;
        }
        return hash;
    }

    function initRealtimeSync() {
        const uid = currentUser.uid;
        console.log("Initializing Realtime Sync for UID:", uid);

        // Define collections to sync
        const collections = [
            { name: 'sales', getArr: () => window.S || [], setArr: (val) => window.S = val, trigger: () => { if(window.pState && window.pState.currentTab === 'dash' && typeof window.rDash === 'function') window.rDash(); } },
            { name: 'targets', getArr: () => window.T || [], setArr: (val) => window.T = val, trigger: () => { if(window.pState && window.pState.currentTab === 'tgt' && typeof window.rTgt === 'function') window.rTgt(); } },
            { name: 'customers', getArr: () => window.C || [], setArr: (val) => window.C = val, trigger: () => {} },
            { name: 'leads', getArr: () => JSON.parse(localStorage.getItem('sp_leads') || '[]'), setArr: (val) => localStorage.setItem('sp_leads', JSON.stringify(val)), trigger: () => { if(typeof P !== 'undefined' && P === 'leads' && typeof window.rLeads === 'function') window.rLeads(); } }
        ];

        // 1. Listeners
        collections.forEach(col => {
            db.collection('users').doc(uid).collection(col.name).onSnapshot(snap => {
                if (snap.metadata.hasPendingWrites) return; 
                let newArr = [];
                localHashes[col.name] = {};
                
                snap.forEach(doc => {
                    let data = doc.data();
                    data._id = doc.id;
                    newArr.push(data);
                    
                    // Cache the hash so we don't re-upload it
                    let hashData = {...data}; delete hashData._id;
                    localHashes[col.name][doc.id] = hashObj(hashData);
                });
                
                if (col.name === 'sales') newArr.sort((a, b) => new Date(b.Date||0) - new Date(a.Date||0));
                
                isSyncingFromServer = true;
                col.setArr(newArr);
                
                // Keep localStorage in sync just in case
                if (col.name === 'sales') localStorage.setItem('sp_sales', JSON.stringify(newArr));
                if (col.name === 'targets') localStorage.setItem('sp_target', JSON.stringify(newArr));
                if (col.name === 'customers') localStorage.setItem('sp_customers', JSON.stringify(newArr));
                
                col.trigger();
                isSyncingFromServer = false;
            });
        });
        
        // 2. Override cloudAutoSave to push diffs
        window.cloudAutoSave = async function(msg) {
            if (isSyncingFromServer) return;
            if (!currentUser || !db) return;
            
            try {
                const uid = currentUser.uid;
                
                const syncArray = async (colDef) => {
                    let arr = colDef.getArr();
                    let colRef = db.collection('users').doc(uid).collection(colDef.name);
                    
                    let batch = db.batch();
                    let count = 0;
                    
                    for (let i = 0; i < arr.length; i++) {
                        let item = arr[i];
                        
                        // Copy for hashing
                        let hashData = {...item}; 
                        delete hashData._id;
                        let currentHash = hashObj(hashData);
                        
                        if (!item._id) {
                            item._id = db.collection('users').doc().id; 
                        }
                        
                        // If it's new or changed
                        if (localHashes[colDef.name][item._id] !== currentHash) {
                            let docRef = colRef.doc(item._id);
                            batch.set(docRef, item);
                            localHashes[colDef.name][item._id] = currentHash; // Update cache
                            count++;
                        }
                        
                        if (count === 490) {
                            await batch.commit();
                            batch = db.batch();
                            count = 0;
                        }
                    }
                    if (count > 0) await batch.commit();
                };
                
                for (let col of collections) {
                    await syncArray(col);
                }
                
                if (typeof toast === 'function') toast('تم مزامنة التعديلات مع السحابة', 'success');
                console.log("Realtime Sync Complete:", msg);
            } catch(e) {
                console.error("Realtime Sync Error:", e);
                if (typeof toast === 'function') toast('خطأ في المزامنة', 'error');
            }
        };
        
        window.saveToFirebaseCloud = window.cloudAutoSave;
    }
})();

    `;
    
    var map = L.map('real_map').setView([30.0444, 31.2357], 12); // Default to Cairo
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    
    let heatPoints = [];
    let waypoints = []; // for routing
    
    // Add Leads
    let leadsData = typeof getLeads === 'function' ? getLeads() : (JSON.parse(localStorage.getItem('sp_leads')||'[]'));
    leadsData.forEach(l => {
        if(l.lat && l.lng) {
            let lat = parseFloat(l.lat), lng = parseFloat(l.lng);
            heatPoints.push([lat, lng, 1]);
            waypoints.push(L.latLng(lat, lng));
            L.marker([lat, lng]).bindPopup(`<b style="color:#000;">${l.name}</b><br><span style="color:#555;">${l.status}</span><br>${l.phone||''}`).addTo(map);
        }
    });

    if(heatPoints.length > 0 && typeof L.heatLayer === 'function') {
        L.heatLayer(heatPoints, {radius: 35, blur: 20, maxZoom: 17, gradient: {0.4: 'red', 0.7: 'blue', 1.0: 'lime'}}).addTo(map);
        let bounds = L.latLngBounds(heatPoints.map(p => [p[0], p[1]]));
        map.fitBounds(bounds, {padding: [50, 50]});
    } else {
        // Try to locate user if no points
        map.locate({setView: true, maxZoom: 14});
    }
    
    let routingControl = null;
    
    document.getElementById('btnRoute').onclick = () => {
        if (waypoints.length < 2) {
            alert(L_lang==='ar'?'يجب إضافة موقعين على الأقل للعملاء لرسم خط السير!':'You need at least 2 locations to draw a route!');
            return;
        }
        
        document.getElementById('btnRoute').style.display = 'none';
        document.getElementById('btnClearRoute').style.display = 'block';
        
        if (typeof toast === 'function') toast(L_lang==='ar'?'جاري رسم خط السير الأقصر...':'Calculating shortest route...', 'info');
        
        routingControl = L.Routing.control({
            waypoints: waypoints,
            routeWhileDragging: false,
            fitSelectedRoutes: true,
            showAlternatives: false,
            lineOptions: {
                styles: [{color: '#0ea5e9', opacity: 0.8, weight: 6}]
            },
            createMarker: function() { return null; } // Don't add extra markers
        }).addTo(map);
    };
    
    document.getElementById('btnClearRoute').onclick = () => {
        if(routingControl) {
            map.removeControl(routingControl);
            routingControl = null;
        }
        document.getElementById('btnRoute').style.display = 'block';
        document.getElementById('btnClearRoute').style.display = 'none';
    };
}
